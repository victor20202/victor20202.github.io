<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#101c2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIAControl Estudio: Gestión de Proyectos</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#667085;--pr:#2457d6;--pr2:#e8eefc;--ok:#157f4b;--okb:#e3f6ec;--ko:#b42318;--kob:#fde8e6;--wa:#b54708;--wab:#fff3e0;--bd:#e2e6ef;--a1:#dbe6ff;--a2:#d9f2e6;--a3:#ffe9cf;--a4:#f0e2ff;--sh:0 2px 8px rgba(20,35,80,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--card:#1a202c;--tx:#e8ecf4;--mu:#97a1b5;--pr:#7ea3ff;--pr2:#222d49;--ok:#5fd39a;--okb:#14352a;--ko:#ff8a80;--kob:#3a1c1a;--wa:#f5a85c;--wab:#3a2a15;--bd:#2c3547;--a1:#233559;--a2:#16392c;--a3:#4a3317;--a4:#35244f;--sh:none}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.65 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top{max-width:1000px;margin:auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.logo{font-weight:800;margin-right:auto;font-size:18px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{border:0;background:none;color:var(--mu);padding:7px 11px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--pr2);color:var(--pr);font-weight:700}
main{max-width:1000px;margin:auto;padding:18px 16px 70px}
h1{font-size:26px;margin:.2em 0 .4em;line-height:1.25}h2{font-size:21px;margin:1.5em 0 .4em}h3{font-size:17px;margin:.8em 0 .3em}
p{margin:.5em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mu{color:var(--mu);font-size:14px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--pr2);color:var(--pr)}.btn:disabled{opacity:.45;cursor:default}
.btn.big{padding:13px 22px;font-size:17px;background:#fff;color:#1d3fa1}.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn.good{background:var(--ok);color:#fff}.btn.bad{background:var(--ko);color:#fff}
.bar{height:9px;background:var(--pr2);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.bar.g i{background:var(--ok)}.bar.r i{background:var(--ko)}.bar.y i{background:var(--wa)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:var(--pr2);color:var(--pr);margin:0 4px 4px 0;font-weight:600}.tag.ok{background:var(--okb);color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row.end{margin-top:26px}.row.sp{justify-content:space-between}
select{font:inherit;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left}
.hero{background:linear-gradient(135deg,#1d3fa1,#4a7bff 60%,#7a5cff);color:#fff;border-radius:18px;padding:26px;display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0 0 6px;opacity:.95;max-width:520px}.hr{font-size:78px}
.stat .bigx{font-size:32px;font-weight:800;line-height:1.2}.stat .bigx.s{font-size:17px;line-height:1.35}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.chc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;box-shadow:var(--sh);transition:transform .12s}
.chc:hover{transform:translateY(-3px);border-color:var(--pr)}.chc.done{border-color:var(--ok)}
.cn{font-size:30px;display:flex;align-items:center;gap:8px}.cn small{font-size:13px;color:var(--mu);font-weight:700}
.chc h3{margin:.3em 0}.meta{margin-top:8px}
/* lectura */
.crumb{margin-bottom:8px}.crumb a{color:var(--pr);text-decoration:none}
.lesson{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px 24px;box-shadow:var(--sh)}
.lh{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px}.ic2{font-size:44px;line-height:1}
.lead{background:var(--pr2);border-radius:12px;padding:12px 14px;margin:6px 0 4px;font-size:17px}
.lesson h2{border-bottom:2px solid var(--pr2);padding-bottom:5px}
.cc{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.cx{background:var(--pr2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.cx:nth-child(4n+2){background:var(--a2)}.cx:nth-child(4n+3){background:var(--a3)}.cx:nth-child(4n+4){background:var(--a4)}
.cx .ic{font-size:26px;font-weight:800;line-height:1.1}.cx span{font-size:14px;color:var(--mu)}
.call{border-radius:12px;padding:12px 14px;margin:14px 0;border-left:5px solid var(--pr);background:var(--pr2)}
.call.ex{border-color:var(--ok);background:var(--okb)}.call.wa{border-color:var(--wa);background:var(--wab)}.call.eg{border-color:#8a5cf5;background:var(--a4)}
.call>b{display:block;margin-bottom:3px}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.vc{background:var(--a1);border-radius:12px;padding:12px 16px}.vc.alt{background:var(--a3)}.vc h3{margin-top:0}.vc ul{margin:0;padding-left:18px}.vc li{margin:4px 0}
.steps{display:grid;gap:8px;margin:12px 0}.st{display:flex;gap:12px;align-items:flex-start;background:var(--pr2);border-radius:12px;padding:10px 12px}
.st i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pr);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
.st span{display:block;color:var(--mu);font-size:14.5px}
.sum{background:linear-gradient(135deg,var(--okb),var(--pr2));border-radius:14px;padding:12px 18px;margin-top:22px}.sum ul{margin:6px 0 0;padding-left:20px}
.fig{margin:16px 0;background:var(--bg);border-radius:14px;padding:10px}.fig svg{width:100%;height:auto;display:block}
svg .t{font-size:12.5px;fill:var(--tx)}svg .tb{font-size:13.5px;font-weight:700;fill:var(--tx)}svg .tm{font-size:12px;fill:var(--mu)}
svg .s0{fill:var(--a4);stroke:#8a5cf5;stroke-width:1.5}svg .s1{fill:var(--a1);stroke:var(--pr);stroke-width:1.5}svg .s2{fill:var(--a2);stroke:var(--ok);stroke-width:1.5}svg .s3{fill:var(--a3);stroke:var(--wa);stroke-width:1.5}
svg .ln{stroke:var(--mu);stroke-width:1.6;fill:none}svg .ax{stroke:var(--mu);stroke-width:1.5}
svg .dot{fill:var(--card);stroke:var(--pr);stroke-width:3}svg .ring{fill:none;stroke:var(--bd);stroke-width:3;stroke-dasharray:6 6}
svg .nd{stroke-width:2}
svg .pv{fill:none;stroke:var(--pr);stroke-width:3}svg .ev{fill:none;stroke:var(--ok);stroke-width:3}svg .ac{fill:none;stroke:var(--ko);stroke-width:3}
details.cx summary,details.st summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:4px}
details.st summary{flex-direction:row;gap:12px;align-items:flex-start}
details summary::-webkit-details-marker{display:none}
details.cx{padding:12px}details.cx[open]{grid-column:1/-1}
.cx em,.st em{font-style:normal;font-size:12px;font-weight:700;color:var(--pr);margin-top:2px}
details[open]>summary em{display:none}
.dt{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);font-size:15.5px;line-height:1.65}
details.st{flex-direction:column;align-items:stretch;gap:0}
details.st .dt{margin-left:42px}
details.cx:hover,details.st:hover{box-shadow:0 0 0 2px var(--pr2)}
.toc{background:var(--bg);border-radius:12px;padding:10px 14px;margin:12px 0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px}
.toc a{color:var(--pr);text-decoration:none;font-weight:600}.toc a:hover{text-decoration:underline}
.lesson p{font-size:16.5px}
/* flash y cuestionario */
.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:21px;cursor:pointer;user-select:none;background:linear-gradient(135deg,var(--pr2),var(--a4));border-radius:18px;padding:22px;margin:12px 0;box-shadow:var(--sh)}
.flash.back{background:linear-gradient(135deg,var(--okb),var(--a1))}
.qh{display:flex;justify-content:space-between;align-items:center}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);padding:11px 12px;border-radius:11px;margin:8px 0;font:inherit;cursor:pointer}
.opt i{flex:none;width:26px;height:26px;border-radius:7px;background:var(--pr2);color:var(--pr);font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.opt:hover:not(:disabled){border-color:var(--pr)}.opt.sel{border-color:var(--pr);background:var(--pr2)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ko{background:var(--kob);border-color:var(--ko)}
.exp{background:var(--pr2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px}
.okt{color:var(--ok)}
.res{display:flex;gap:18px;align-items:center}.rg{position:relative;width:96px;height:96px;flex:none}.rg b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.rb{fill:none;stroke:var(--pr2);stroke-width:8}.rf{fill:none;stroke:var(--ok);stroke-width:8;stroke-linecap:round}
.card{overflow-x:auto}.reqc ul{margin:0 0 8px;padding-left:20px}.reqc li{margin:6px 0}.lk{display:flex;flex-direction:column;padding:8px 0;border-bottom:1px solid var(--bd)}.lk a{color:var(--pr);font-weight:600;text-decoration:none;word-break:break-word}.lkc .row{margin-top:8px}.lkc a.btn{text-decoration:none;font-size:14px}@media(max-width:560px){td,th{font-size:13.5px;padding:6px 4px}.hero{flex-direction:column;align-items:flex-start}.hr{display:none}.lesson{padding:16px}}
.back{margin-left:auto;font-weight:700;font-size:.9rem;color:#c98a3d;text-decoration:none;border:1px solid #c98a3d;border-radius:999px;padding:4px 12px}</style>
<style id="tema">/* ===== Tema VIAControl ===== */
:root{--bg:#f4f5f7;--card:#fff;--tx:#101c2a;--mu:#5a6470;--pr:#1d3250;--pr2:#e8ecf2;--ac:#c98a3d;--acb:#f8eedf;--bd:#dfe3ea;--wa:#9a6218;--wab:#fbf0dc;--a1:#e8ecf2;--a2:#f8eedf;--a3:#edf0f4;--a4:#f3e6d0;--btn:#101c2a;--btn-tx:#fff;--sh:0 2px 10px rgba(16,28,42,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0b141f;--card:#132033;--tx:#e9eef5;--mu:#93a1b3;--pr:#e2b06a;--pr2:#1d2c43;--ac:#d99b4c;--acb:#34291a;--bd:#28374d;--wa:#e2b06a;--wab:#34291a;--a1:#1b2b42;--a2:#3a2d1a;--a3:#203049;--a4:#33291b;--btn:#d99b4c;--btn-tx:#101c2a;--sh:none}}
body{background:var(--bg);color:var(--tx);letter-spacing:.005em}
header{border-bottom:0;box-shadow:0 3px 0 var(--ac),0 6px 16px rgba(16,28,42,.06)}
.top{padding:8px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--tx)}
.logo img{height:34px;width:auto;background:#fff;padding:4px 10px;border-radius:9px;display:block}
.logo span{font-size:14px;font-weight:700;color:var(--mu);border-left:2px solid var(--ac);padding-left:10px}
nav button{font-weight:600}
nav button.on{background:var(--pr2);color:var(--pr);box-shadow:inset 0 -3px 0 var(--ac)}
h1{letter-spacing:-.01em}
.btn{background:var(--btn);color:var(--btn-tx);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn.sec{background:var(--pr2);color:var(--pr);box-shadow:none}
.btn.big{background:var(--ac);color:#101c2a}.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.good{background:var(--ok);color:#fff}.btn.bad{background:var(--ko);color:#fff}
.bar{background:var(--pr2)}.bar i{background:var(--ac)}.bar.g i{background:var(--ok)}.bar.r i{background:var(--ko)}.bar.y i{background:var(--wa)}
.tag{background:var(--pr2);color:var(--pr)}.tag.ok{background:var(--okb);color:var(--ok)}
.hero{background-image:radial-gradient(circle at 92% -10%,rgba(201,138,61,.45),transparent 52%),linear-gradient(135deg,#101c2a,#344456);border-bottom:4px solid var(--ac);box-shadow:0 8px 24px rgba(16,28,42,.18)}
.hero h1{letter-spacing:-.02em}
.stat{border-top:3px solid var(--ac)}
.chc:hover{border-color:var(--ac)}.chc.done{border-color:var(--ok)}
.lesson h2{border-bottom:2px solid var(--ac);display:inline-block;padding-right:18px}
.lead{background:var(--acb);border-left:5px solid var(--ac)}
.call{background:var(--pr2);border-left-color:var(--pr)}.call.eg{background:var(--acb);border-left-color:var(--ac)}
.cx .ic{color:var(--pr)}
.st i{background:var(--btn);color:var(--btn-tx)}
.vc{background:var(--a1)}.vc.alt{background:var(--a2)}
.sum{background:linear-gradient(135deg,var(--okb),var(--acb))}
.fig{background:var(--bg)}
svg .s0{fill:var(--a4);stroke:var(--ac)}svg .s1{fill:var(--a1);stroke:var(--pr)}svg .s2{fill:var(--a3);stroke:var(--mu)}svg .s3{fill:var(--a2);stroke:#a56a1f}
svg .dot{stroke:var(--ac)}
.flash{background:linear-gradient(135deg,var(--pr2),var(--acb));border:1px solid var(--bd)}.flash.back{background:linear-gradient(135deg,var(--okb),var(--a1))}
.opt i{background:var(--pr2);color:var(--pr)}.opt:hover:not(:disabled){border-color:var(--ac)}.opt.sel{border-color:var(--ac);background:var(--acb)}
.exp{background:var(--pr2)}
.toc a{color:var(--pr)}
.crumb a{color:var(--pr)}
.lk a{color:var(--pr)}
details.cx:hover,details.st:hover{box-shadow:0 0 0 2px var(--ac)}
.cx em,.st em{color:var(--ac)}
::selection{background:var(--ac);color:#101c2a}
@media(max-width:560px){.logo span{display:none}.logo img{height:30px}}
</style>
<style>.aviso{background:var(--acb);border:1px solid var(--ac);border-left:6px solid var(--ac);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14.5px;line-height:1.55}.aviso p{margin:6px 0 0}.foot{max-width:1000px;margin:0 auto;padding:0 16px 40px;color:var(--mu);font-size:12.5px;text-align:center}</style>
</head>

const DETAILS={
"Integración (7)":"<b>Gestión de la integración (PMBOK 6):</b> 1) Desarrollar el acta de constitución; 2) Desarrollar el plan para la dirección del proyecto; 3) Dirigir y gestionar el trabajo; 4) Gestionar el conocimiento; 5) Monitorear y controlar el trabajo; 6) Realizar el control integrado de cambios; 7) Cerrar el proyecto o fase. Es el área que coordina todas las demás. En la 8.ª edición su contenido se reparte sobre todo en el dominio de <b>gobernanza</b>.",
"Alcance (6)":"<b>PMBOK 6:</b> Planificar la gestión del alcance, Recopilar requisitos, Definir el alcance, Crear la EDT/WBS, Validar el alcance, Controlar el alcance. Los cuatro primeros son de planificación; los dos últimos, de monitoreo y control. En la 8.ª edición corresponde al dominio de <b>alcance</b> (6 procesos).",
"Cronograma (6)":"<b>PMBOK 6:</b> Planificar la gestión del cronograma, Definir las actividades, Secuenciar las actividades, Estimar la duración, Desarrollar el cronograma y Controlar el cronograma. La 8.ª edición lo condensa en el dominio de <b>cronograma</b> (3 procesos).",
"Costos (4)":"<b>PMBOK 6:</b> Planificar la gestión de costos, Estimar costos, Determinar el presupuesto y Controlar los costos. En la 8.ª edición pasa al dominio de <b>finanzas</b> (4 procesos).",
"Calidad (3)":"<b>PMBOK 6:</b> Planificar la gestión de la calidad, Gestionar la calidad (asegurar) y Controlar la calidad. En la 8.ª edición la calidad es un <b>principio</b> (“integra la calidad en procesos y entregables”) y se aplica dentro de los dominios.",
"Recursos (6)":"<b>PMBOK 6:</b> Planificar la gestión de recursos, Estimar los recursos de las actividades, Adquirir recursos, Desarrollar el equipo, Dirigir al equipo y Controlar los recursos. En la 8.ª edición corresponde al dominio de <b>recursos</b> (5 procesos).",
"Comunicaciones (3)":"<b>PMBOK 6:</b> Planificar la gestión de las comunicaciones, Gestionar las comunicaciones y Monitorear las comunicaciones. En la 8.ª se integran al dominio de <b>interesados</b> (7 procesos) por su relación con el involucramiento.",
"Riesgos (7)":"<b>PMBOK 6:</b> Planificar la gestión de riesgos, Identificar riesgos, Realizar el análisis cualitativo, Realizar el análisis cuantitativo, Planificar la respuesta, Implementar la respuesta y Monitorear los riesgos. En la 8.ª edición es el dominio de <b>riesgo</b> (6 procesos).",
"Adquisiciones (3)":"<b>PMBOK 6:</b> Planificar la gestión de las adquisiciones, Efectuar las adquisiciones y Controlar las adquisiciones. La 8.ª edición amplía el contenido de adquisiciones; confirma en el libro en qué dominio se ubica cada proceso.",
"Interesados (4)":"<b>PMBOK 6:</b> Identificar a los interesados, Planificar el involucramiento, Gestionar el involucramiento y Monitorear el involucramiento. En la 8.ª es el dominio de <b>interesados</b>.",
"Fecha":"El examen actualizado entró en vigor el <b>9 de julio de 2026</b>. Si tu libro o curso es anterior, revisa que cubra el nuevo esquema de dominios y el PMBOK 8.",
"Duración":"<b>240 minutos</b> en total, con <b>dos descansos de 10 minutos</b>. Practica con el simulacro del portal para acostumbrarte a mantener la concentración varias horas.",
"Preguntas":"<b>180 preguntas.</b> Parte de ellas puede ser de prueba (no se califican). Las fuentes consultadas discrepan en el número exacto de preguntas calificadas; verifica en pmi.org.",
"Dominios":"<b>Personas 33%</b> (liderazgo, equipo, conflictos, interesados), <b>Procesos 41%</b> (técnicas y gestión del proyecto) y <b>Entorno de negocio 26%</b> (valor, estrategia, cumplimiento, cambio, sostenibilidad).",
"Formatos":"Además de opción múltiple y selección múltiple, se reportan casos con varias preguntas, preguntas con gráficos (por ejemplo un Gantt o un diagrama), arrastrar y soltar y relacionar. Se evalúa el criterio, no la memorización.",
"Temporal":"Tiene inicio y fin definidos. El resultado puede durar mucho; lo temporal es el esfuerzo.",
"Único":"El resultado es distinto a todo lo hecho antes, aunque haya similitudes.",
"Elaboración progresiva":"Se detalla el plan a medida que se conoce más información.",
"Valor":"El proyecto existe para generar valor; se mide con los beneficios realizados, no solo con tiempo y costo.",
"Estructura funcional":"La autoridad está en el gerente funcional. El director de proyecto tiene poca autoridad, presupuesto limitado y suele ser coordinador o facilitador.",
"Estructura matricial":"Los recursos reportan al gerente funcional y al director del proyecto. Puede ser <b>débil</b> (más funcional), <b>balanceada</b> o <b>fuerte</b> (el director tiene más autoridad). Genera conflictos por prioridad de recursos.",
"Estructura orientada a proyectos":"Los recursos se asignan al proyecto y reportan al director de proyecto. Alta autoridad, pero al terminar los proyectos el equipo puede quedarse sin trabajo.",
"Factores ambientales (EEF)":"Condiciones fuera del control del equipo que influyen en el proyecto: cultura, estructura, normas, condiciones del mercado, infraestructura y estándares gubernamentales.",
"Activos de los procesos (OPA)":"Lo que la organización ya tiene y se puede reutilizar: políticas, procedimientos, plantillas, bases de datos de lecciones aprendidas y proyectos anteriores.",
"Caso de negocio":"Documento que justifica la inversión: necesidad, opciones, análisis costo-beneficio y recomendación.",
"Plan de gestión de beneficios":"Describe qué beneficios se esperan, quién es responsable, cuándo se realizarán y cómo se medirán.",
"Acta de constitución":"Autoriza formalmente el proyecto y otorga autoridad al director. Incluye propósito, objetivos, riesgos de alto nivel, hitos, presupuesto resumido y criterios de éxito. La emite el patrocinador o alguien externo al proyecto con autoridad suficiente.",
"Líneas base":"Versiones aprobadas de alcance, cronograma y costo. Sirven de referencia para medir desempeño y solo cambian por el control de cambios.",
"Control de cambios":"Proceso formal: registrar la solicitud, evaluar impacto, decidir en la instancia adecuada, implementar, actualizar líneas base y comunicar.",
"Cierre":"Se confirma la aceptación, se liberan recursos, se transfiere el producto, se cierran contratos, se archivan documentos y se registran lecciones aprendidas.",
"Entrevistas":"Se pregunta directamente a expertos o interesados. Permite profundizar, aunque es lenta si hay muchos participantes.",
"Grupos focales":"Una conversación moderada con un grupo seleccionado para conocer expectativas y actitudes.",
"Encuestas":"Cuestionarios para muchas personas; útil para datos cuantitativos y poblaciones dispersas.",
"Observación":"Se observa el trabajo real (job shadowing) para descubrir procesos que los usuarios no mencionan.",
"Prototipos":"Modelos tempranos del producto que permiten recibir retroalimentación antes de construirlo.",
"Diagrama de afinidad":"Agrupa ideas surgidas en una lluvia de ideas por similitud para analizarlas.",
"Enunciado del alcance":"Describe entregables, criterios de aceptación, exclusiones, supuestos y restricciones.",
"EDT / WBS":"Descomposición jerárquica del trabajo en entregables y paquetes de trabajo; sigue la regla del 100%.",
"Diccionario de la EDT":"Describe cada elemento de la EDT: responsable, criterios de aceptación, hitos y estimaciones.",
"Línea base del alcance":"Enunciado del alcance aprobado + EDT + diccionario de la EDT. Sirve para medir y controlar el alcance.",
"Scope creep":"Crecimiento no controlado del alcance. Se evita con una línea base clara y control de cambios.",
"Gold plating":"Entregar más de lo pedido sin autorización. Es una mala práctica: agrega costo y riesgo sin aprobación.",
"Fin a inicio (FS)":"La sucesora no empieza hasta que termina la predecesora. Ejemplo: no se pinta hasta terminar el enlucido.",
"Inicio a inicio (SS)":"Ambas actividades pueden empezar a la vez (o con desfase). Ejemplo: empezar la redacción mientras se hace la investigación.",
"Fin a fin (FF)":"La sucesora no puede terminar hasta que termine la predecesora. Ejemplo: terminar las pruebas cuando termina el desarrollo.",
"Inicio a fin (SF)":"Poco usada: la sucesora no puede terminar hasta que empiece la predecesora.",
"Adelanto (lead)":"Permite adelantar la sucesora respecto a la predecesora (por ejemplo, empezar 2 días antes de que termine la anterior). Es una forma de ejecución rápida.",
"Retraso (lag)":"Una espera obligatoria entre actividades. Ejemplo: esperar 3 días a que seque el concreto.",
"Holgura total":"Tiempo que una actividad puede atrasarse sin retrasar la fecha de fin del proyecto. Se calcula como LS − ES (o LF − EF). Las actividades de la ruta crítica tienen holgura cero.",
"Holgura libre":"Tiempo que una actividad puede atrasarse sin retrasar el inicio temprano de la actividad que la sigue.",
"LS":"<b>Inicio tardío</b>: la fecha más tardía en que puede empezar sin atrasar el proyecto. LS = LF − duración.",
"EF":"<b>Fin temprano</b>: ES + duración. Se calcula en el recorrido hacia adelante.",
"Estimación análoga":"Se basa en proyectos similares anteriores. Es rápida y barata, pero menos precisa. Útil al inicio.",
"Estimación paramétrica":"Aplica una relación estadística entre datos históricos y una variable (por ejemplo, costo por metro cuadrado × metros). Es más precisa si el modelo es bueno.",
"Ascendente (bottom-up)":"Se estima cada componente de la EDT y se suma. Es la más precisa y la más laboriosa.",
"Tres puntos":"Usa tres estimaciones (optimista, más probable, pesimista). Triangular: (O+M+P)/3; PERT (beta): (O+4M+P)/6.",
"PV":"<b>Valor planificado</b>: valor del trabajo que debería estar terminado a la fecha.",
"EV":"<b>Valor ganado</b>: valor del trabajo realmente terminado (porcentaje completado × BAC).",
"AC":"<b>Costo real</b>: lo que se gastó para el trabajo realizado.",
"BAC":"<b>Presupuesto hasta la conclusión</b>: la suma de los presupuestos de toda la línea base.",
"ROI":"<b>ROI = beneficio neto / costo</b>. Mide rentabilidad, pero no considera el tiempo.",
"Payback":"Tiempo para recuperar la inversión. Prefiere el menor, pero ignora lo que ocurre después.",
"VAN (NPV)":"Valor presente de los flujos futuros descontados menos la inversión inicial. Positivo: crea valor. Se prefiere el proyecto de mayor VAN.",
"TIR (IRR)":"Tasa de descuento que hace el VAN igual a cero. Se compara con la tasa mínima exigida.",
"Costo-beneficio":"Relación entre beneficios y costos (BCR). Mayor a 1 indica que los beneficios superan a los costos.",
"Poder / interés":"Matriz: alto poder y alto interés = gestionar de cerca; alto poder y bajo interés = mantener satisfecho; bajo poder y alto interés = mantener informado; bajo y bajo = monitorear.",
"Poder / influencia":"Clasifica interesados según su capacidad de influir en el resultado y su nivel de autoridad.",
"Modelo de prominencia":"Evalúa tres atributos: <b>poder</b>, <b>urgencia</b> y <b>legitimidad</b>. Un interesado con los tres es “definitivo” y requiere atención inmediata.",
"Mapa de empatía":"Ayuda a entender qué piensa, siente, dice y hace un interesado, para dirigir mejor el involucramiento.",
"Comunicación interactiva":"Intercambio en tiempo real entre dos o más personas: reuniones, llamadas, videoconferencias. Es la más eficaz para evitar malentendidos.",
"Push (enviar)":"El emisor envía la información: correos, cartas, informes. No asegura que el receptor la haya entendido.",
"Pull (halar)":"El receptor accede cuando lo necesita: sitio web, repositorio, portal de e-learning.",
"Maslow":"Pirámide: fisiológicas, seguridad, sociales, estima y autorrealización. Se motiva atendiendo la necesidad no satisfecha.",
"Herzberg":"Los <b>factores higiénicos</b> (salario, condiciones) evitan la insatisfacción pero no motivan; los <b>motivadores</b> (logro, reconocimiento, responsabilidad) sí motivan.",
"McGregor":"<b>Teoría X</b>: las personas evitan el trabajo y necesitan supervisión. <b>Teoría Y</b>: buscan responsabilidad y se autodirigen. En proyectos modernos se recomienda un estilo cercano a la Y.",
"McClelland":"Necesidades de <b>logro</b>, <b>afiliación</b> y <b>poder</b>. Cada persona tiene una predominante.",
"Vroom (expectativa)":"La motivación depende de creer que el esfuerzo llevará al desempeño y que el desempeño llevará a una recompensa valiosa.",
"Liderazgo servicial":"El líder pone al equipo primero: escucha, remueve impedimentos y desarrolla personas. Es el estilo asociado al ágil.",
"Transformacional":"Inspira con una visión, motiva y estimula la innovación y el cambio.",
"Situacional":"El líder ajusta su estilo (dirigir, entrenar, apoyar, delegar) según la madurez de las personas.",
"Poder formal":"Se basa en el cargo. Útil, pero el liderazgo efectivo no depende solo de él.",
"Poder experto":"Se basa en el conocimiento o habilidad; muy respetado en equipos técnicos.",
"Poder referente":"Se basa en la admiración o el respeto por la persona; es poderoso y perdurable.",
"Colaborar / resolver el problema":"Busca una solución que satisfaga a todos. Es la técnica más efectiva a largo plazo y la preferida en el examen.",
"Comprometer":"Cada parte cede algo. Es una solución parcial; las dos partes quedan parcialmente satisfechas.",
"Suavizar / complacer":"Enfatiza los acuerdos y minimiza las diferencias; calma el conflicto pero no lo resuelve.",
"Forzar / dirigir":"Se impone una solución; útil en emergencias, pero deja resentimiento.",
"Evitar / retirarse":"Posponer o ignorar el conflicto; solo adecuado si el tema es trivial o se necesita tiempo.",
"Riesgo":"Evento o condición incierta que, si ocurre, tiene un efecto positivo o negativo sobre los objetivos.",
"Problema (issue)":"Un riesgo que ya ocurrió o una situación actual que requiere acción. Se gestiona en el registro de incidentes.",
"Supuesto":"Factor que se considera verdadero sin pruebas. Los supuestos mal validados son una fuente de riesgo; se registran y se revisan.",
"Restricción":"Limitación que afecta el proyecto: fecha fija, presupuesto máximo, tecnología obligatoria.",
"Riesgo residual":"Lo que queda después de aplicar una respuesta. Se acepta o se vuelve a tratar.",
"Riesgo secundario":"Un riesgo nuevo que aparece como consecuencia de una respuesta. Debe analizarse antes de aprobar la respuesta.",
"EMV":"<b>Valor monetario esperado = probabilidad × impacto</b>. Las amenazas tienen valor negativo y las oportunidades positivo. Ejemplo: 20% × USD 100.000 = USD 20.000.",
"Simulación Monte Carlo":"Ejecuta miles de simulaciones con rangos de duración o costo para obtener la probabilidad de cumplir una fecha o presupuesto.",
"Árbol de decisión":"Muestra opciones, probabilidades y resultados; se elige la rama con mejor EMV.",
"Diagrama de tornado":"Análisis de sensibilidad: ordena las variables por su impacto en el resultado; el riesgo más influyente va arriba.",
"Costo de la conformidad":"Lo que se gasta para <b>evitar</b> defectos: prevención (capacitación, diseño) y evaluación (inspecciones, pruebas, auditorías).",
"Costo de la no conformidad":"Lo que cuesta tener defectos: fallas internas (retrabajo, desperdicio) y fallas externas (garantías, reclamos, pérdida de reputación).",
"Diagrama de Pareto":"Histograma ordenado que muestra qué pocas causas generan la mayoría de los problemas (regla 80/20).",
"Causa y efecto (Ishikawa)":"Diagrama de espina de pescado: organiza causas posibles (personas, métodos, materiales, máquinas, medio ambiente) de un problema.",
"Gráfico de control":"Muestra la variación del proceso en el tiempo con límites superior e inferior. La <b>regla de siete</b>: siete puntos consecutivos de un mismo lado de la media indican una causa asignable.",
"Histograma":"Gráfico de barras que muestra la distribución de frecuencias de una variable.",
"Alineación estratégica":"Cada proyecto debe contribuir a un objetivo estratégico de la organización.",
"Realización de beneficios":"Los beneficios se materializan después de la entrega; alguien debe responder por medirlos.",
"ADKAR":"Modelo de cambio individual: <b>A</b>wareness (conciencia), <b>D</b>esire (deseo), <b>K</b>nowledge (conocimiento), <b>A</b>bility (habilidad), <b>R</b>einforcement (refuerzo).",
"Kotter":"8 pasos: crear urgencia, formar coalición, desarrollar visión, comunicarla, remover obstáculos, lograr victorias a corto plazo, consolidar mejoras y anclar el cambio en la cultura.",
"Lewin":"Descongelar (preparar para el cambio), cambiar (implementar) y recongelar (consolidar).",
"Individuos e interacciones":"El primer valor del Manifiesto Ágil: se priorizan personas y colaboración sobre procesos y herramientas.",
"Software funcionando":"Se prefiere un producto que funcione antes que documentación extensa.",
"Colaboración con el cliente":"Se prefiere trabajar con el cliente de forma continua antes que negociar contratos rígidos.",
"Respuesta al cambio":"Se prefiere adaptarse a nuevas necesidades antes que seguir un plan que ya no sirve.",
"Product Owner":"Responsable de maximizar el valor. Gestiona el backlog del producto: lo ordena, lo explica y decide qué se construye primero.",
"Scrum Master":"Responsable de que Scrum se entienda y se aplique. Facilita, elimina impedimentos y entrena al equipo; no es un jefe.",
"Desarrolladores":"Los profesionales que crean el incremento en cada Sprint. Se autoorganizan y son responsables de la calidad.",
"Planificación del Sprint":"Se define <b>por qué</b> el Sprint es valioso (objetivo), <b>qué</b> se puede hacer y <b>cómo</b> se logrará.",
"Scrum diario":"Reunión corta (15 minutos) en la que los Desarrolladores sincronizan y ajustan el plan del día.",
"Revisión del Sprint":"Se inspecciona el incremento con los interesados y se adapta el backlog según la retroalimentación.",
"Retrospectiva":"El equipo analiza cómo trabajó y acuerda mejoras concretas para el próximo Sprint.",
"Backlog del producto":"Lista ordenada y emergente de todo lo que se necesita para el producto; la gestiona el Product Owner.",
"Backlog del Sprint":"Objetivo del Sprint más los elementos seleccionados del backlog y el plan para entregarlos.",
"Incremento":"Paso concreto hacia el objetivo del producto, utilizable y que cumple la definición de terminado.",
"Definición de terminado":"Descripción formal del estado del incremento cuando cumple las medidas de calidad requeridas.",
"Límite de trabajo en curso (WIP)":"Se limita el número de elementos en proceso por etapa. Reduce el multitasking y revela cuellos de botella.",
"Tiempo de ciclo":"Tiempo que pasa un elemento desde que se empieza a trabajar hasta que se termina.",
"Lead time":"Tiempo desde que se solicita un elemento hasta que se entrega al cliente.",
"Diagrama de flujo acumulado":"Muestra la cantidad de elementos en cada etapa a lo largo del tiempo; bandas que se ensanchan indican cuellos de botella.",
"XP (Extreme Programming)":"Prácticas técnicas: programación en pares, desarrollo guiado por pruebas, integración continua y refactorización."

"Planificar respuestas":"Se elige una estrategia para cada riesgo prioritario y se asigna un dueño.",

<tr><td>Cronograma</td><td>Planificación · Medición</td><td><b>Cronograma</b> (3)</td></tr>
<tr><td>Costos</td><td>Planificación · Medición</td><td><b>Finanzas</b> (4)</td></tr>
<tr><td>Interesados y Comunicaciones</td><td>Interesados</td><td><b>Interesados</b> (7)</td></tr>
<tr><td>Recursos y Adquisiciones</td><td>Equipo · Trabajo del proyecto</td><td><b>Recursos</b> (5)</td></tr>
<tr><td>Riesgos</td><td>Incertidumbre</td><td><b>Riesgo</b> (6)</td></tr>
<tr><td>Calidad</td><td>Entrega</td><td>Principio de calidad + procesos dentro de los dominios</td></tr></table>
<p class="mu">Total en la 8.ª: 9+6+3+4+7+5+6 = 40 procesos. Dónde exactamente cae calidad y adquisiciones lo debes confirmar en el libro: es mi interpretación a partir de resúmenes.</p></div>`+
CALL("tip","Idea para estudiar: aprende cada tema con la lógica de procesos (qué se hace), y luego pregúntate qué <b>principio</b> lo respalda. Esa doble mirada es la que pide el examen actual.")+
H("4. Qué cambió en el examen PMP")+
CC([["📅","Fecha","Nuevo examen vigente desde el 9 de julio de 2026."],["⏱️","Duración","240 minutos con dos descansos de 10 minutos."],["📝","Preguntas","180 preguntas."],["📊","Dominios","Personas 33% · Procesos 41% · Entorno de negocio 26%."],["🧪","Formatos","Opción múltiple, selección múltiple, arrastrar y soltar, casos y gráficos."]])+
CALL("ex","El dominio <b>Entorno de negocio</b> pasó de 8% a 26%. Esto significa que debes dominar estrategia, valor, cumplimiento, sostenibilidad y cambio organizacional, no solo técnicas de gestión.")+
CALL("wa","<b>Dato por confirmar:</b> la página de PMI confirma 180 preguntas, 240 minutos y los porcentajes 33/41/26. Fuentes de terceros discrepan en cuántas preguntas se califican (170 o 175). Verifica en pmi.org antes de inscribirte, junto con tarifas y requisitos vigentes.")+
CALL("tip","Fuentes de terceros mencionan que alrededor de 60% de las preguntas abordan enfoques ágiles o híbridos. Es una estimación no oficial; por eso este portal dedica un capítulo completo al ágil y lo mezcla en las demás secciones.")+
H("5. Cómo se estudia con este portal")+
STEPS([["Lee un capítulo completo","Con calma, abre cada concepto con clic para ver la explicación."],["Repasa tarjetas","Repetición espaciada: lo que fallas vuelve antes."],["Practica por capítulo","Preguntas al azar con explicación inmediata."],["Haz simulacros","Cronometrados y sin ayuda."]])+
SUM(["El PMBOK 6 es de procesos (49), el 7 de principios y dominios (12 y 8), el 8 combina 6 principios, 7 dominios y 40 procesos.","El examen vigente tiene 180 preguntas, 240 minutos y 3 dominios: Personas 33%, Procesos 41%, Entorno de negocio 26%.","Estudia con la lógica de procesos y con la de principios; el examen mezcla ambas.","Confirma datos de inscripción y tarifas directamente en pmi.org."])},

{id:"c1",n:1,ic:"🏛️",t:"Fundamentos, ciclo de vida y gobernanza",ex:"Procesos · Entorno de negocio · Dominio de gobernanza",min:35,
sub:"Qué es un proyecto, cómo se organiza una empresa, qué enfoques existen y cómo se gobierna el trabajo.",
b:()=>
H("1. Proyecto, programa, portafolio y operaciones")+
P("Un <b>proyecto</b> es un esfuerzo temporal que crea un producto, servicio o resultado único. Un <b>programa</b> agrupa proyectos relacionados para obtener beneficios que no se lograrían por separado. Un <b>portafolio</b> agrupa proyectos, programas y operaciones para alcanzar objetivos estratégicos. Las <b>operaciones</b> son trabajo continuo que mantiene el negocio.")+
CC([["⏳","Temporal","Tiene inicio y fin definidos."],["✨","Único","El resultado es distinto a lo anterior."],["📈","Elaboración progresiva","Se detalla con más información."],["💎","Valor","Un proyecto existe para generar valor."]])+
H("2. Ciclo de vida y enfoques de desarrollo")+
DG.ciclo()+
VS(["Predictivo (cascada)",["Alcance, tiempo y costo se definen al inicio","Cambios por proceso formal","Adecuado con requisitos estables (construcción, infraestructura)"]],["Ágil / adaptativo",["Iteraciones cortas y entregas frecuentes","El alcance evoluciona con retroalimentación","Adecuado con incertidumbre (software, innovación)"]])+
P("<b>Híbrido</b>: combina enfoques. Por ejemplo, planificación predictiva de infraestructura con desarrollo ágil del software. Lo importante en el examen es <b>elegir el enfoque según el contexto</b>: incertidumbre, tamaño, cultura del cliente, regulación y disponibilidad de usuarios.")+
CALL("tip","La mejor práctica es la <b>adaptación (tailoring)</b>: ajustar procesos, documentos y gobernanza al proyecto, sin eliminar lo esencial.")+
H("3. Organización y entorno")+
CC([["🏢","Estructura funcional","Autoridad del gerente funcional; el director de proyecto tiene poca autoridad."],["🔀","Estructura matricial","Autoridad compartida; débil, balanceada o fuerte."],["🚀","Estructura orientada a proyectos","El director tiene alta autoridad y controla recursos."],["🌍","Factores ambientales (EEF)","Cultura, regulaciones, mercado, infraestructura."],["📚","Activos de los procesos (OPA)","Plantillas, políticas, lecciones aprendidas."]])+
H("4. Gobernanza y autorización del proyecto")+
STEPS([["Caso de negocio","Justifica por qué se invierte: problema, opciones, costos y beneficios."],["Plan de gestión de beneficios","Define qué beneficios, quién los posee y cómo se medirán."],["Acta de constitución","Autoriza formalmente al proyecto y al director; define objetivos de alto nivel."],["Líneas base","Alcance, cronograma y costo aprobados que sirven de referencia."],["Control de cambios","Todo cambio se evalúa e implementa por un proceso formal."],["Cierre","Se verifican entregables, se transfiere el producto y se registran lecciones aprendidas."]])+
CALL("ex","El director de proyecto <b>no inicia el proyecto sin acta</b>. Si falta, lo correcto es pedir al patrocinador que se emita o ayudar a desarrollarla; no avanzar sin autorización.")+
P("<b>Gobernanza</b> es el marco para decidir y supervisar: roles, umbrales de aprobación, comités, puertas de revisión. En el PMBOK 8 es un dominio propio, con el mayor número de procesos (9).")+
CALL("eg","Un proyecto de TI tiene un sobrecosto de 15%. El umbral de gobernanza exige aprobación del comité para desvíos mayores a 10%. El director <b>no decide solo</b>: documenta, analiza opciones y lleva el cambio al comité.")+
H("5. Rol del director de proyecto")+
P("Es responsable de lograr los objetivos del proyecto. Combina <b>habilidades técnicas</b>, <b>liderazgo</b> y <b>visión de negocio</b>. Su trabajo incluye facilitar, resolver conflictos, comunicar y tomar decisiones dentro de su autoridad. En proyectos ágiles actúa más como líder servicial que como controlador.")+
SUM(["Proyecto: temporal y único; operaciones: continuas.","Elige el enfoque (predictivo, ágil, híbrido) según el contexto y adáptalo.","La estructura organizacional determina la autoridad del director.","Caso de negocio → acta → líneas base → control de cambios → cierre.","El director no se salta la gobernanza."])},

{id:"c2",n:2,ic:"📐",t:"Alcance: requisitos, EDT y control",ex:"Procesos · dominio de alcance",min:35,
sub:"Definir con precisión qué se hará y qué no, y evitar que crezca sin control.",
b:()=>
H("1. Alcance del producto y del proyecto")+
P("El <b>alcance del producto</b> son las características y funciones del entregable. El <b>alcance del proyecto</b> es el trabajo necesario para entregarlo. Ambos se definen de manera distinta pero se relacionan.")+
H("2. Recopilar requisitos")+
CC([["🎤","Entrevistas","Preguntas directas a expertos e interesados."],["👥","Grupos focales","Conversación moderada con un grupo."],["📋","Encuestas","Para muchas personas, datos cuantificables."],["👀","Observación","Mirar cómo se hace el trabajo real."],["🧪","Prototipos","Modelos tempranos para recibir retroalimentación."],["🗂️","Diagrama de afinidad","Agrupar ideas por similitud."]])+
P("Los requisitos pueden ser de <b>negocio</b>, de <b>interesados</b>, <b>funcionales</b>, <b>no funcionales</b> (rendimiento, seguridad), de <b>transición</b> y de <b>calidad</b>. Se documentan y se vinculan con una <b>matriz de trazabilidad de requisitos</b>, que muestra de dónde viene cada requisito y en qué entregable se cumple.")+
H("3. Definir el alcance y crear la EDT/WBS")+
P("El <b>enunciado del alcance</b> describe entregables, criterios de aceptación, exclusiones y supuestos. La <b>EDT/WBS</b> descompone el trabajo en niveles cada vez más pequeños hasta llegar a <b>paquetes de trabajo</b>. Sigue la <b>regla del 100%</b>: la EDT debe incluir todo el trabajo y solamente ese trabajo.")+
CC([["📄","Enunciado del alcance","Entregables, criterios, exclusiones, supuestos."],["🌳","EDT / WBS","Descomposición jerárquica del trabajo."],["📖","Diccionario de la EDT","Describe cada paquete de trabajo."],["📏","Línea base del alcance","Enunciado + EDT + diccionario."]])+
H("4. Validar y controlar")+
VS(["Validar el alcance",["Aceptación formal de los entregables por el cliente o patrocinador","Se hace sobre entregables ya verificados","Responde: ¿esto es lo que necesitaba?"]],["Controlar la calidad",["Verificar que el entregable cumple los requisitos de calidad","Lo hace el equipo antes de entregar","Responde: ¿está bien hecho?"]])+
CALL("ex","Orden típico: primero <b>controlar la calidad</b> (interno) y luego <b>validar el alcance</b> (aceptación del cliente).")+
CC([["📈","Scope creep","Crecimiento no controlado del alcance."],["🎁","Gold plating","Agregar extras que nadie pidió."]])+
CALL("wa","Ante un cambio de alcance solicitado por un interesado, el director <b>no lo acepta ni lo rechaza por su cuenta</b>: registra la solicitud, evalúa el impacto y la lleva al control integrado de cambios.")+
H("5. Alcance en entornos ágiles")+
P("En ágil, el alcance vive en el <b>backlog del producto</b>: una lista priorizada de historias de usuario. Se refina continuamente. Se trabaja con un <b>producto mínimo viable (MVP)</b> para aprender rápido, y el alcance variable permite fijar el tiempo y el costo (iteraciones) y ajustar qué se entrega.")+
SUM(["Requisitos → enunciado del alcance → EDT → línea base.","La EDT sigue la regla del 100%.","Validar = aceptación del cliente; controlar calidad = verificación interna.","Los cambios se gestionan formalmente.","En ágil, el alcance se gestiona en el backlog priorizado."])},

{id:"c3",n:3,ic:"📅",t:"Cronograma: ruta crítica y compresión",ex:"Procesos · dominio de cronograma",min:40,
sub:"Cómo se programa el trabajo, se calcula la ruta crítica y se recupera un atraso.",
b:()=>
H("1. Del alcance a las actividades")+
STEPS([["Definir actividades","Dividir los paquetes de trabajo en actividades."],["Secuenciar","Establecer dependencias entre actividades."],["Estimar duraciones","Con juicio experto, análogas, paramétricas o de tres puntos."],["Desarrollar el cronograma","Calcular fechas con el método de la ruta crítica."],["Controlar","Comparar el avance con la línea base y corregir."]])+
H("2. Dependencias")+
CC([["➡️","Fin a inicio (FS)","La sucesora empieza cuando termina la predecesora. La más común."],["⏯️","Inicio a inicio (SS)","Ambas empiezan juntas o con desfase."],["⏹️","Fin a fin (FF)","Ambas terminan juntas."],["⏪","Inicio a fin (SF)","Rara; la sucesora termina cuando empieza la predecesora."],["⏱️","Adelanto (lead)","Permite adelantar una actividad."],["🕒","Retraso (lag)","Obliga a esperar un tiempo."]])+
H("3. Ruta crítica")+
P("La <b>ruta crítica</b> es la secuencia de actividades dependientes más larga; determina la duración mínima del proyecto. Las actividades críticas tienen <b>holgura cero</b>. Se calcula con un recorrido hacia adelante (ES, EF) y hacia atrás (LS, LF).")+DG.red()+
CC([["⏳","Holgura total","LS − ES: tiempo que se puede retrasar sin afectar el fin."],["🪢","Holgura libre","Retraso posible sin afectar a la sucesora inmediata."],["🏁","EF","ES + duración: fin temprano."],["🕓","LS","LF − duración: inicio tardío."]])+
CALL("ex","Si se atrasa una actividad <b>crítica</b>, se atrasa el proyecto. Si se atrasa una no crítica, depende de cuánta holgura tiene. Una pregunta típica: “¿Qué hace el director primero?” — calcular el <b>impacto en la ruta crítica</b>.")+
H("4. Estimación de tres puntos (PERT)")+
P("Con O = optimista, M = más probable y P = pesimista: <b>E = (O + 4M + P) / 6</b> y <b>desviación estándar = (P − O) / 6</b>. Ejemplo: O=4, M=6, P=14 → E = (4+24+14)/6 = 7 días; σ = (14−4)/6 ≈ 1,67.")+
H("5. Recuperar un atraso")+
VS(["Compresión (crashing)",["Agregar recursos para acortar la duración","<b>Aumenta el costo</b>","Funciona solo en actividades críticas"]],["Ejecución rápida (fast tracking)",["Hacer en paralelo actividades que iban en secuencia","<b>Aumenta el riesgo</b> (retrabajo)","Funciona solo si hay dependencias discrecionales"]])+
CALL("tip","Otras técnicas: <b>nivelación de recursos</b> (resuelve sobreasignación; puede alargar el cronograma) y <b>suavizado</b> (usa la holgura sin cambiar la ruta crítica).")+
H("6. Cronograma ágil")+
P("Se planifica por <b>iteraciones</b> y <b>lanzamientos</b>. Se estima en <b>puntos de historia</b> y se mide la <b>velocidad</b> (puntos completados por iteración). Se visualiza con gráficos de <b>burndown</b> (trabajo restante) y <b>burnup</b> (trabajo completado y alcance).")+
SUM(["La ruta crítica determina la duración mínima y tiene holgura cero.","PERT: E = (O + 4M + P)/6.","Crashing agrega costo; fast tracking agrega riesgo.","La nivelación resuelve conflictos de recursos.","En ágil se usa velocidad y gráficos burndown/burnup."])},

{id:"c4",n:4,ic:"💰",t:"Finanzas: costos, valor ganado y contratos",ex:"Procesos · dominio de finanzas",min:45,
sub:"Estimar, presupuestar y controlar el costo con datos objetivos.",
b:()=>
H("1. Estimar y presupuestar")+
CC([["📌","Estimación análoga","Basada en proyectos anteriores; rápida, menos precisa."],["🧮","Estimación paramétrica","Usa datos estadísticos (por ejemplo, costo por metro cuadrado)."],["🔬","Ascendente (bottom-up)","Estima cada paquete y suma; más precisa."],["🎯","Tres puntos","Promedia escenarios optimista, probable y pesimista."]])+
P("<b>Presupuesto</b> = estimación de costos de actividades + <b>reserva para contingencias</b> (riesgos identificados). La <b>reserva de gestión</b> cubre riesgos desconocidos y no forma parte de la línea base de costos. La suma da la <b>línea base de costos</b>; con la reserva de gestión se obtiene el <b>presupuesto del proyecto</b>.")+
H("2. Valor ganado (EVM)")+DG.evm()+
CC([["PV","Valor planificado","Lo que debía estar hecho."],["EV","Valor ganado","Valor del trabajo realmente completado."],["AC","Costo real","Lo gastado."],["BAC","Presupuesto al concluir","Presupuesto total de la línea base."]])+
`<div class="card"><table><tr><th>Medida</th><th>Fórmula</th><th>Lectura</th></tr>
<tr><td>CV</td><td>EV − AC</td><td>Negativo = sobre costo</td></tr>
<tr><td>SV</td><td>EV − PV</td><td>Negativo = atrasado</td></tr>
<tr><td>CPI</td><td>EV / AC</td><td>&lt; 1 = ineficiente en costo</td></tr>
<tr><td>SPI</td><td>EV / PV</td><td>&lt; 1 = atrasado</td></tr>
<tr><td>EAC (tendencia actual)</td><td>BAC / CPI</td><td>Se espera que el desempeño continúe</td></tr>
<tr><td>EAC (desvío atípico)</td><td>AC + (BAC − EV)</td><td>El problema fue puntual</td></tr>
<tr><td>EAC (CPI y SPI)</td><td>AC + (BAC − EV)/(CPI × SPI)</td><td>Costo y plazo influyen</td></tr>
<tr><td>ETC</td><td>EAC − AC</td><td>Cuánto falta gastar</td></tr>
<tr><td>VAC</td><td>BAC − EAC</td><td>Desvío esperado al final</td></tr>
<tr><td>TCPI (a BAC)</td><td>(BAC − EV)/(BAC − AC)</td><td>Eficiencia necesaria para terminar en presupuesto</td></tr></table></div>`+
CALL("eg","BAC=1000; PV=400; EV=300; AC=450. CPI = 0,67; SPI = 0,75; EAC (tendencia) = 1000/0,67 ≈ 1500; ETC ≈ 1050; VAC ≈ −500. El proyecto va mal en costo y en plazo.")+
CALL("ex","Cuando el enunciado dice “el problema no se repetirá”, usa <b>EAC = AC + (BAC − EV)</b>. Si dice “el desempeño actual continuará”, usa <b>BAC / CPI</b>.")+
H("3. Medidas financieras de negocio")+
CC([["📈","ROI","Beneficio neto / costo."],["⏱️","Payback","Tiempo para recuperar la inversión."],["💵","VAN (NPV)","Valor presente de los flujos menos la inversión; mayor a 0 conviene."],["📊","TIR (IRR)","Tasa que hace VAN = 0."],["⚖️","Costo-beneficio","Relación entre beneficios y costos."]])+
P("Para comparar proyectos, se elige el de <b>mayor VAN</b> (o mayor TIR si se compara contra la tasa mínima). El <b>costo hundido</b> (lo ya gastado) no debe influir en decidir si continuar.")+
H("4. Contratos")+
VS(["Precio fijo (FFP, FPIF)",["El proveedor asume el riesgo de sobrecosto","Se necesita alcance claro","FPIF: incluye incentivo por desempeño"]],["Costo reembolsable (CPFF, CPIF)",["El comprador asume más riesgo","Útil cuando el alcance es incierto","Se paga el costo más una tarifa o incentivo"]])+
P("<b>Tiempo y materiales (T&M)</b> es intermedio: se paga por hora más materiales; el riesgo del alcance es del comprador.")+
SUM(["Presupuesto = estimaciones + reserva de contingencia; la reserva de gestión queda fuera de la línea base.","Domina CV, SV, CPI, SPI, EAC, ETC, VAC y TCPI.","El costo hundido no influye en la decisión de continuar.","FFP: riesgo del vendedor; CPFF: riesgo del comprador; T&M: mixto."])},

{id:"c5",n:5,ic:"🙋",t:"Interesados y comunicaciones",ex:"Personas · dominio de interesados",min:30,
sub:"Identificar, comprender e involucrar a todos los que afectan o son afectados por el proyecto.",
b:()=>
H("1. Identificar y analizar interesados")+
P("Un <b>interesado</b> es cualquier persona, grupo u organización que puede afectar o ser afectado por el proyecto. Se identifican desde el inicio y durante todo el ciclo de vida, y se registran en el <b>registro de interesados</b>.")+
CC([["⚡","Poder / interés","Alto poder y alto interés: gestionar de cerca."],["🎯","Poder / influencia","Quién puede influir realmente en el resultado."],["🧭","Modelo de prominencia","Poder, urgencia y legitimidad."],["🗺️","Mapa de empatía","Qué piensa, siente y necesita un interesado."]])+
H("2. Niveles de compromiso")+
STEPS([["Desconocedor","No sabe del proyecto ni de sus impactos."],["Resistente","Conoce el proyecto y se opone."],["Neutral","Conoce el proyecto, ni apoya ni se opone."],["Partidario","Conoce los impactos y apoya."],["Líder","Participa activamente para asegurar el éxito."]])+
P("Se compara el nivel <b>actual</b> con el <b>deseado</b> y se planifican acciones para cerrar la brecha. No todos deben llegar a líder; el esfuerzo se enfoca en los más relevantes.")+
H("3. Comunicaciones")+
P("Las comunicaciones deben llegar a la persona correcta, en el momento correcto y con el medio adecuado. El número de canales entre <b>n</b> personas es <b>n(n − 1) / 2</b>. Con 5 personas hay 10 canales; con 10, 45. Por eso al crecer el equipo la comunicación se complica.")+
CC([["📣","Comunicación interactiva","Reuniones, llamadas; ida y vuelta."],["📤","Push (enviar)","Correo, informes; el emisor envía."],["📥","Pull (halar)","Repositorios, portales; el receptor consulta."]])+
CALL("tip","Comunicar bien incluye <b>escuchar activamente</b>, confirmar que el mensaje se entendió, usar el canal adecuado y manejar el ruido (barreras culturales, idioma, distancia).")+
H("4. Gestionar expectativas y resistencia")+
P("La resistencia es información. Se explora su causa, se escucha, se explica el beneficio y se involucra a la persona en la solución. Evita ignorar o aislar a los interesados difíciles: la mayoría de los problemas con interesados se resuelven <b>hablando directamente</b> con ellos.")+
CALL("ex","Cuando un interesado clave expresa preocupación, la respuesta correcta suele ser <b>reunirse con él para entender el problema</b> antes de escalar o cambiar el plan.")+
SUM(["Identifica interesados al inicio y revisa durante todo el proyecto.","Evalúa el nivel de compromiso actual vs. deseado.","Canales de comunicación: n(n−1)/2.","Comunica con métodos interactivos, push y pull según el caso.","La conversación directa resuelve la mayoría de los conflictos."])},

{id:"c6",n:6,ic:"🤝",t:"Recursos, equipo y liderazgo",ex:"Personas · dominio de recursos",min:40,
sub:"Cómo formar, motivar y dirigir equipos, y cómo gestionar los recursos y las compras.",
b:()=>
H("1. Formar y desarrollar el equipo")+
STEPS([["Formación","Los miembros se conocen y dependen del líder."],["Tormenta","Aparecen conflictos sobre roles y métodos."],["Normalización","Se acuerdan normas y crece la confianza."],["Desempeño","El equipo trabaja con autonomía y eficacia."],["Disolución","El equipo se desarma al terminar."]])+
CALL("tip","Una herramienta clave es el <b>acta del equipo</b> (team charter): valores, normas de comunicación, toma de decisiones y resolución de conflictos acordadas por todos.")+
H("2. Motivación")+
CC([["🔺","Maslow","Jerarquía de necesidades: fisiológicas, seguridad, sociales, estima y autorrealización."],["🧂","Herzberg","Factores higiénicos evitan insatisfacción; motivadores generan satisfacción."],["⚙️","McGregor","Teoría X (personas evitan el trabajo) y Teoría Y (buscan responsabilidad)."],["🏅","McClelland","Necesidad de logro, afiliación y poder."],["💡","Vroom (expectativa)","Se esfuerza quien cree que logrará el resultado y que será recompensado."]])+
H("3. Liderazgo y poder")+
CC([["🛎️","Liderazgo servicial","Remueve obstáculos y apoya al equipo."],["🌟","Transformacional","Inspira un cambio y una visión."],["🔀","Situacional","Adapta el estilo al nivel de madurez del equipo."],["🏛️","Poder formal","Basado en el cargo."],["🎓","Poder experto","Basado en conocimientos."],["💞","Poder referente","Basado en el respeto y la admiración."]])+
H("4. Resolver conflictos")+
CC([["🤝","Colaborar / resolver el problema","Ganar-ganar; la técnica preferida."],["⚖️","Comprometer","Cada parte cede algo."],["😊","Suavizar / complacer","Resalta acuerdos y minimiza diferencias."],["📢","Forzar / dirigir","Imponer una solución; para emergencias."],["🚪","Evitar / retirarse","Posponer; solo si es trivial."]])+
CALL("ex","Ante un conflicto entre dos miembros, el director primero <b>los reúne para resolverlo entre ellos</b> (colaborar); escala solo si no hay acuerdo.")+
H("5. Recursos físicos y matriz de asignación")+
P("La <b>matriz RACI</b> asigna Responsable, Aprobador (Accountable), Consultado e Informado. El <b>histograma de recursos</b> muestra la carga por periodo. Un recurso con demanda superior a su disponibilidad indica sobreasignación; se resuelve con nivelación, contratación o cambios de prioridad.")+
H("6. Adquisiciones")+
STEPS([["Decidir hacer o comprar","Analizar si se produce internamente o se contrata."],["Documentos de la licitación","Enunciado del trabajo (SOW), RFP, RFQ o IFB."],["Seleccionar proveedor","Con criterios ponderados de evaluación."],["Administrar el contrato","Controlar desempeño, cambios y pagos."],["Cerrar","Aceptar entregables y cerrar el contrato."]])+
SUM(["El equipo evoluciona por etapas; el acta del equipo ordena la convivencia.","Conoce las teorías de motivación y los estilos de liderazgo.","Preferida: colaborar para resolver conflictos.","Usa RACI e histogramas para gestionar los recursos.","Las adquisiciones siguen un ciclo: planificar, seleccionar, administrar y cerrar."])},

{id:"c7",n:7,ic:"⚡",t:"Riesgo: identificar, analizar y responder",ex:"Procesos · dominio de riesgo",min:40,
sub:"Un riesgo es un evento incierto que puede afectar los objetivos, para bien o para mal.",
b:()=>
H("1. Conceptos clave")+
CC([["❓","Riesgo","Evento o condición incierta con efecto positivo o negativo."],["🔥","Problema (issue)","Un riesgo que ya ocurrió."],["📦","Supuesto","Algo que se considera cierto sin comprobarlo."],["🔒","Restricción","Limitación impuesta al proyecto."],["🌱","Riesgo residual","El que queda después de responder."],["🔁","Riesgo secundario","El que nace de la respuesta."]])+
H("2. Proceso de gestión del riesgo")+
STEPS([["Planificar la gestión","Define metodología, roles, escalas, umbrales y presupuesto para riesgos."],["Identificar","Lluvia de ideas, entrevistas, listas de verificación, análisis FODA, juicio experto."],["Análisis cualitativo","Priorizar por probabilidad e impacto."],["Análisis cuantitativo","Medir el efecto numérico: EMV, simulación Monte Carlo, árbol de decisión."],["Planificar respuestas","Elegir estrategia y dueño de cada riesgo."],["Implementar respuestas","Ejecutar el plan acordado."],["Monitorear","Vigilar disparadores, riesgos nuevos y reservas."]])+
H("3. Análisis cualitativo: matriz de probabilidad e impacto")+DG.matriz()+
P("Cada riesgo se califica por <b>probabilidad</b> e <b>impacto</b>. El producto indica la prioridad: los riesgos en la zona roja se atienden primero.")+
H("4. Análisis cuantitativo")+
CC([["EMV","Valor monetario esperado","Probabilidad × impacto."],["🎲","Simulación Monte Carlo","Simula miles de escenarios para estimar plazos o costos."],["🌳","Árbol de decisión","Compara opciones según el EMV."],["🌪️","Diagrama de tornado","Muestra qué variables tienen mayor sensibilidad."]])+
CALL("eg","Un riesgo tiene 30% de probabilidad y un impacto de USD 50.000: EMV = −15.000. Una oportunidad con 40% y USD 20.000 tiene EMV = +8.000. Se pueden sumar los EMV de los riesgos independientes para estimar la reserva.")+
H("5. Estrategias de respuesta")+
VS(["Amenazas",["<b>Escalar</b>: pasar a un nivel con autoridad","<b>Evitar</b>: eliminar la causa","<b>Transferir</b>: pasar el impacto a un tercero (seguro, contrato)","<b>Mitigar</b>: reducir probabilidad o impacto","<b>Aceptar</b>: activa (reserva) o pasiva"]],["Oportunidades",["<b>Escalar</b>","<b>Explotar</b>: asegurar que ocurra","<b>Compartir</b>: asociarse con quien lo aprovecha mejor","<b>Mejorar</b>: aumentar probabilidad o impacto","<b>Aceptar</b>"]])+
CALL("ex","Un seguro <b>transfiere</b>; no elimina el riesgo. Y mitigar no es lo mismo que aceptar: <b>mitigar actúa</b>; aceptar pasiva solo documenta.")+
H("6. Reservas")+
P("La <b>reserva para contingencias</b> cubre riesgos conocidos y se incluye en la línea base de costos. La <b>reserva de gestión</b> cubre riesgos desconocidos y la controla la dirección. El director de proyecto usa la de contingencia con su autoridad; para la de gestión necesita aprobación.")+
H("7. Riesgo en ágil")+
P("El riesgo se reduce con <b>iteraciones cortas</b>, entregas frecuentes y retroalimentación. Se incluyen riesgos en el backlog, se priorizan según valor y se aborda lo más incierto primero (por ejemplo, con un <b>spike</b>).")+
SUM(["Riesgo = evento incierto; problema = ya ocurrió.","Cualitativo prioriza; cuantitativo mide.","Amenazas: escalar, evitar, transferir, mitigar, aceptar.","Oportunidades: escalar, explotar, compartir, mejorar, aceptar.","Contingencia (conocidos) vs. gestión (desconocidos)."])},

{id:"c8",n:8,ic:"🌐",t:"Calidad y entorno de negocio",ex:"Entorno de negocio (26%) y procesos",min:40,
sub:"El dominio que más creció en el examen: valor, estrategia, cumplimiento, sostenibilidad y cambio.",
b:()=>
H("1. Calidad")+
P("<b>Calidad</b> es el grado en que los entregables cumplen los requisitos. Se previene más que se corrige. Se gestiona en tres frentes: planificar, asegurar (gestionar) y controlar.")+
CC([["🛡️","Costo de la conformidad","Prevención y evaluación (capacitación, pruebas, auditorías)."],["💥","Costo de la no conformidad","Fallas internas (retrabajo) y externas (garantías, reclamos)."],["📊","Diagrama de Pareto","El 20% de causas genera el 80% de problemas."],["🐟","Causa y efecto (Ishikawa)","Organiza causas posibles de un problema."],["📈","Gráfico de control","Detecta si un proceso está bajo control (regla de siete)."],["📐","Histograma","Distribución de frecuencias."]])+
H("2. Valor y beneficios")+
P("El proyecto existe para <b>entregar valor</b>. El director debe asegurar que el <b>plan de gestión de beneficios</b> tenga dueños y métricas, y que los beneficios se realicen aun después de cerrar el proyecto.")+
CC([["🎯","Alineación estratégica","Cada proyecto se vincula a un objetivo."],["📉","Realización de beneficios","Los beneficios se miden tras la entrega."],["🧾","Caso de negocio","Debe revisarse si el contexto cambia."]])+
H("3. Cumplimiento y regulación")+
P("El proyecto debe respetar leyes, normas internas y estándares. Los <b>requisitos de cumplimiento</b> (por ejemplo, protección de datos, seguridad, ambientales) se identifican desde el inicio, se incluyen en el alcance y se auditan. Un incumplimiento puede detener el proyecto.")+
H("4. Cambio organizacional")+
CC([["🔄","ADKAR","Conciencia, Deseo, Conocimiento, Habilidad, Refuerzo."],["🏔️","Kotter","8 pasos: urgencia, coalición, visión, comunicar, remover obstáculos, victorias, consolidar, anclar."],["🧱","Lewin","Descongelar, cambiar, recongelar."]])+
CALL("tip","El proyecto produce un cambio, pero el <b>cambio lo realizan las personas</b>. Planificar la comunicación, la capacitación y el apoyo a los usuarios es parte del valor.")+
H("5. Sostenibilidad e inteligencia artificial")+
P("El PMBOK 8 incorpora la <b>sostenibilidad</b> como principio: considerar impactos ambientales, sociales y económicos en alcance, adquisiciones, calidad y entregables. También destaca la <b>IA</b>: puede ayudar con estimaciones, análisis de riesgos, resumen de reportes y detección de desvíos, pero exige validar los datos, proteger la información y mantener la responsabilidad humana.")+
CALL("eg","Un equipo usa IA para resumir actas y proyectar atrasos. El director verifica los datos, evita compartir información confidencial y decide él mismo; la herramienta apoya, no reemplaza el criterio.")+
H("6. Entorno externo")+
P("Factores como <b>mercado</b>, <b>competencia</b>, <b>tecnología</b>, <b>economía</b> y <b>regulación</b> pueden cambiar la viabilidad del proyecto. Se monitorean y, si es necesario, se ajusta el plan o se evalúa detener el proyecto.")+
SUM(["Prevenir cuesta menos que corregir.","El valor se mide por los beneficios realizados.","Incluye el cumplimiento desde el inicio.","El cambio organizacional exige gestionar a las personas.","Sostenibilidad e IA son temas nuevos del PMBOK 8."])},

{id:"c9",n:9,ic:"🔁",t:"Ágil e híbrido",ex:"Procesos y Personas · enfoque adaptativo",min:45,
sub:"Valores, principios y marcos ágiles. Una parte importante del examen actual.",
b:()=>
H("1. El Manifiesto Ágil")+
CC([["👥","Individuos e interacciones","Sobre procesos y herramientas."],["💻","Software funcionando","Sobre documentación exhaustiva."],["🤝","Colaboración con el cliente","Sobre negociación contractual."],["🔄","Respuesta al cambio","Sobre seguir un plan."]])+
P("No se descarta lo de la derecha; se valora <b>más</b> lo de la izquierda. Los 12 principios incluyen entregar valor con frecuencia, aceptar cambios, trabajar juntos, mantener un ritmo sostenible y reflexionar para mejorar.")+
H("2. Scrum")+DG.scrum()+
CC([["🧑‍💼","Product Owner","Maximiza el valor; gestiona y prioriza el backlog."],["🛎️","Scrum Master","Facilita Scrum, remueve impedimentos y entrena al equipo."],["🧑‍💻","Desarrolladores","Equipo autoorganizado que construye el incremento."]])+
CC([["🗓️","Planificación del Sprint","Define el objetivo del Sprint y el trabajo."],["☀️","Scrum diario","Reunión de 15 minutos para sincronizar y ajustar."],["📣","Revisión del Sprint","Se presenta el incremento y se recibe retroalimentación."],["🔍","Retrospectiva","El equipo mejora su forma de trabajar."]])+
CC([["📚","Backlog del producto","Lista priorizada de todo lo necesario."],["📋","Backlog del Sprint","Lo que se hará en el Sprint."],["📦","Incremento","Resultado utilizable que cumple la definición de terminado."],["✅","Definición de terminado","Criterios compartidos para considerar el trabajo completo."]])+
H("3. Kanban y otras prácticas")+
CC([["🧱","Límite de trabajo en curso (WIP)","Limita lo que se hace a la vez para fluir mejor."],["⏱️","Tiempo de ciclo","Desde que empieza hasta que termina una tarea."],["🕰️","Lead time","Desde que se solicita hasta que se entrega."],["📈","Diagrama de flujo acumulado","Detecta cuellos de botella."],["🧪","XP (Extreme Programming)","Programación en pares, pruebas primero, integración continua."]])+
H("4. Historias de usuario y estimación")+
P("Una <b>historia de usuario</b> se escribe como “Como [rol], quiero [funcionalidad] para [beneficio]”. El criterio <b>INVEST</b> indica que debe ser Independiente, Negociable, Valiosa, Estimable, Pequeña (Small) y Verificable (Testable). Se estima en <b>puntos de historia</b> (por ejemplo, con la secuencia de Fibonacci y <i>planning poker</i>).")+
CALL("eg","Si un equipo completa 20, 24 y 22 puntos en tres Sprints, su velocidad promedio es 22. Con un backlog de 110 puntos, se necesitan unos 5 Sprints.")+
H("5. Liderazgo y roles en ágil")+
P("El director de proyecto actúa como <b>líder servicial</b>: facilita, protege al equipo, elimina impedimentos y apoya la mejora. Los equipos <b>se autoorganizan</b>; los directivos no asignan tareas de forma individual. El patrocinador y el Product Owner priorizan según valor de negocio.")+
H("6. Híbrido y elección del enfoque")+
P("Se evalúan: <b>incertidumbre de requisitos</b>, <b>riesgo</b>, <b>regulación</b>, <b>cultura</b>, <b>disponibilidad del cliente</b> y <b>tamaño del equipo</b>. Un enfoque híbrido puede usar una estructura predictiva para el alcance general y ciclos ágiles para componentes inciertos. Lo importante es <b>justificar</b> la elección y mantener la gobernanza.")+
CALL("ex","Ante un equipo ágil con impedimentos externos, la respuesta correcta es que el <b>Scrum Master (o el líder servicial)</b> los remueva, no que el equipo los ignore ni que se cambie el alcance sin consultar al Product Owner.")+
SUM(["El Manifiesto Ágil valora personas, producto funcionando, colaboración y respuesta al cambio.","Scrum: tres roles, cuatro eventos principales y tres artefactos.","Kanban visualiza el flujo y limita el trabajo en curso.","La velocidad sirve para proyectar el trabajo restante.","El líder es servicial y el equipo se autoorganiza."])}
];

function rec(c,ok){const s=S.stats[c]=S.stats[c]||{ok:0,t:0};s.t++;if(ok)s.ok++;save()}

function bar(p,cls){return `<div class="bar ${cls||""}"><i style="width:${p||0}%"></i></div>`}
function ring(p,label){const r=34,c=2*Math.PI*r;return `<div class="rg"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="${r}" class="rb"/><circle cx="40" cy="40" r="${r}" class="rf" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 40 40)"/></svg><b>${p}%</b></div>`}

/* preferir preguntas que se han visto menos; azar en el desempate */
function pickQ(pool,n){return shuf(pool).sort((a,b)=>(S.seen[a]||0)-(S.seen[b]||0)).slice(0,n)}

function buildToc(){const hs=[...document.querySelectorAll(".lesson h2")];if(!hs.length)return;
 hs.forEach((h,i)=>h.id="s"+i);
 $("#toc").innerHTML=`<div class="toc"><b>En este capítulo:</b>${hs.map((h,i)=>`<a href="#s${i}" onclick="document.getElementById('s${i}').scrollIntoView({behavior:'smooth'});return false">${h.textContent.replace(/^\d+\.\s*/,"")}</a>`).join("")}</div>`}
function markLesson(id){S.lessons[id]=Date.now();save();R.capitulo(id)}

/* ---- Tarjetas (Leitner) ---- */
let deck=[],ci=0,flip=false,deckCh=null;
R.tarjetas=c=>{deckCh=c||null;const now=Date.now();
 deck=shuf(CARDS.map((x,i)=>i).filter(i=>(!deckCh||CARDS[i][0]===deckCh)&&(!S.cards[i]||S.cards[i].due<=now)));ci=0;flip=false;drawCard()};
function drawCard(){
 const filt=`<select onchange="R.tarjetas(this.value||null)"><option value="">Todos los capítulos</option>${CH.map(c=>`<option value="${c.id}" ${c.id===deckCh?"selected":""}>Cap. ${c.n}: ${esc(c.t.slice(0,40))}</option>`).join("")}</select>`;
 if(ci>=deck.length){$("#app").innerHTML=`<h1>Tarjetas</h1>${filt}<div class="card" style="margin-top:12px">🎉 No quedan tarjetas pendientes por ahora. Las que fallaste vuelven pronto; las que sabías, en días.</div>`;return}
 const i=deck[ci],c=CARDS[i];
 $("#app").innerHTML=`<h1>Tarjetas</h1>${filt}<p class="mu">${ci+1} de ${deck.length} · Cap. ${chOf(c[0]).n}</p>
 <div class="flash ${flip?"back":""}" onclick="flip=!flip;drawCard()"><span class="mu">${flip?"Respuesta":"Concepto"}</span><div>${flip?esc(c[2]):"<b>"+esc(c[1])+"</b>"}</div></div>
 ${flip?`<div class="row"><button class="btn bad" onclick="grade(${i},false)">No lo sabía</button><button class="btn good" onclick="grade(${i},true)">Lo sabía</button></div>`:`<div class="mu">Intenta recordar la respuesta y luego toca la tarjeta.</div>`}`}
function grade(i,ok){const s=S.cards[i]||{box:0};s.box=ok?Math.min(5,s.box+1):1;
 s.due=ok?Date.now()+BOX_DAYS[s.box]*day:Date.now()+10*60000;
 S.cards[i]=s;rec(CARDS[i][0],ok);ci++;flip=false;drawCard()}

/* ---- Práctica ---- */
R.practica=()=>{
 $("#app").innerHTML=`<h1>Práctica</h1><p class="mu">Cada vez se eligen preguntas al azar; se priorizan las que has visto menos.</p><div class="grid">`+
 CH.map(c=>`<div class="card"><b>${c.ic} Cap. ${c.n}</b><div class="mu">${esc(c.t)}</div><div class="mu">${Q.filter(q=>q[0]===c.id).length} preguntas · acierto ${pct(c.id)===null?"–":pct(c.id)+"%"}</div><div class="row"><button class="btn" onclick="startQuiz('${c.id}',10)">Practicar</button></div></div>`).join("")+
 `</div><div class="card"><b>🎲 Mixto</b><div class="mu">20 preguntas al azar de todos los capítulos</div><div class="row"><button class="btn" onclick="startQuiz(null,20)">Practicar mixto</button></div></div>`};

/* ---- Cuestionario ---- */
function startQuiz(ch,n,exam,opt){
 opt=opt||{};
 let pool=Q.map((q,i)=>i).filter(i=>!ch||Q[i][0]===ch);
 pool=pickQ(pool,n||pool.length);
 clearInterval(tmr);
 qz={items:pool.map(i=>({i,order:shuf([0,1,2,3]),sel:null})),pos:0,exam:!!exam,ch,n,target:opt.target||"#app",embed:!!opt.embed};
 drawQ()}
function drawQ(){
 const it=qz.items[qz.pos],q=Q[it.i],ans=it.sel!==null,box=$(qz.target);
 const last=qz.pos===qz.items.length-1;
 box.innerHTML=`<div class="qh"><span class="mu">Pregunta ${qz.pos+1} de ${qz.items.length} · Cap. ${chOf(q[0]).n}</span>${qz.exam?`<b id="clk"></b>`:""}</div>${bar(100*(qz.pos+(ans?1:0))/qz.items.length)}
 <div class="card q"><h3 style="margin-top:0">${esc(q[1])}</h3>
 ${it.order.map((oi,k)=>{let c="opt";if(!qz.exam&&ans){if(oi===q[3])c+=" ok";else if(oi===it.sel)c+=" ko"}else if(it.sel===oi)c+=" sel";
  return `<button class="${c}" ${(ans&&!qz.exam)?"disabled":""} onclick="pick(${oi})"><i>${"ABCD"[k]}</i>${esc(q[2][oi])}</button>`}).join("")}
 ${ans&&!qz.exam?`<div class="exp"><b>${it.sel===q[3]?"✔ Correcto":"✘ Incorrecto"}.</b> ${esc(q[4])}</div>`:""}
 <div class="row"><button class="btn sec" ${qz.pos===0?"disabled":""} onclick="qz.pos--;drawQ()">Anterior</button>
 <button class="btn" ${!ans&&!qz.exam?"disabled":""} onclick="${last?"finishQuiz()":"qz.pos++;drawQ()"}">${last?"Terminar":"Siguiente"}</button></div></div>`;
 if(qz.exam)tick()}
function pick(oi){const it=qz.items[qz.pos];if(!qz.exam&&it.sel!==null)return;it.sel=oi;
 if(!qz.exam){S.seen[it.i]=(S.seen[it.i]||0)+1;rec(Q[it.i][0],oi===Q[it.i][3])}drawQ()}
function finishQuiz(){clearInterval(tmr);
 let ok=0;const by={};
 qz.items.forEach(it=>{const q=Q[it.i],good=it.sel===q[3];if(good)ok++;
  if(qz.exam){S.seen[it.i]=(S.seen[it.i]||0)+1;rec(q[0],good)}
  by[q[0]]=by[q[0]]||{ok:0,t:0};by[q[0]].t++;if(good)by[q[0]].ok++});
 const n=qz.items.length,p=Math.round(100*ok/n);
 if(qz.exam){S.exams.push({d:Date.now(),ok,n});save()}
 const wrong=qz.items.filter(it=>it.sel!==Q[it.i][3]),embed=qz.embed,box=$(qz.target);
 box.innerHTML=`<div class="card res">${ring(p)}<div><h2 style="margin:0">Resultado: ${ok}/${n}</h2><div class="mu">${p>=75?"¡Muy bien!":p>=60?"Vas bien, sigue practicando.":"Repasa el capítulo y vuelve a intentarlo."}</div>
 <div class="row"><button class="btn" onclick="${embed?"startQuiz(null,5,false,{target:'#qbox',embed:true})":"nav('practica')"}">${embed?"🎲 Otro reto":"Volver a práctica"}</button></div></div></div>
 ${!embed?`<div class="card">${Object.entries(by).map(([k,v])=>`<div>Cap. ${chOf(k).n} · ${esc(chOf(k).t)} <span class="mu">${v.ok}/${v.t}</span>${bar(100*v.ok/v.t,v.ok/v.t>=.7?"g":"r")}</div>`).join("<br>")}</div>`:""}
 ${wrong.length?`<h3>Revisa lo que fallaste (${wrong.length})</h3>`+wrong.map(it=>{const q=Q[it.i];return `<div class="card"><b>${esc(q[1])}</b><div class="mu">Tu respuesta: ${it.sel===null?"sin responder":esc(q[2][it.sel])}</div><div class="okt">Correcta: ${esc(q[2][q[3]])}</div><div class="exp">${esc(q[4])}</div></div>`}).join(""):`<div class="card">🎉 Sin errores.</div>`}`;
 save()}

/* ---- Simulacro ---- */
R.simulacro=()=>{
 const hist=S.exams.slice(-5).reverse().map(e=>`<tr><td>${new Date(e.d).toLocaleDateString()}</td><td>${e.ok}/${e.n}</td><td>${Math.round(100*e.ok/e.n)}%</td></tr>`).join("");
 const nmax=Q.length;
 $("#app").innerHTML=`<h1>Simulacro de examen</h1>
 <div class="card">Preguntas al azar de todos los capítulos, <b>sin retroalimentación hasta el final</b> y con cronómetro. Puedes ir y volver entre preguntas.
 <div class="mu">El examen real: 120 preguntas en 165 min (≈1,4 min por pregunta). Aquí se mantiene la misma proporción.</div>
 <div class="row"><select id="nq"><option value="30">30 preguntas · 41 min</option><option value="60" selected>60 preguntas · 83 min</option><option value="${nmax}">Todas (${nmax}) · ${Math.round(nmax*165/120)} min</option></select>
 <button class="btn" onclick="startExam()">Iniciar simulacro</button></div></div>
 ${hist?`<div class="card"><b>Últimos intentos</b><table><tr><th>Fecha</th><th>Aciertos</th><th>%</th></tr>${hist}</table></div>`:""}`};
let endAt=0;
function startExam(){const n=Math.min(Q.length,+$("#nq").value);endAt=Date.now()+n*165/120*60000;startQuiz(null,n,true)}
function tick(){clearInterval(tmr);
 const f=()=>{const e=$("#clk");if(!e||!qz||!qz.exam){clearInterval(tmr);return}
  const left=endAt-Date.now();if(left<=0){clearInterval(tmr);finishQuiz();return}
  const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);e.textContent="⏱ "+m+":"+String(s).padStart(2,"0")};
 f();tmr=setInterval(f,1000)}

/* ---- Progreso ---- */
R.progreso=()=>{
 const rows=CH.map(c=>{const p=pct(c.id),s=S.stats[c.id];
  return `<tr><td>${c.ic} Cap. ${c.n}: ${esc(c.t)}</td><td style="width:34%">${bar(p,p===null?"":p>=75?"g":p>=60?"y":"r")}</td><td>${p===null?"–":p+"% ("+s.ok+"/"+s.t+")"}</td></tr>`}).join("");
 const weak=CH.filter(c=>pct(c.id)!==null&&pct(c.id)<70);
 const learned=Object.values(S.cards).filter(c=>c.box>=3).length;
 const seen=Object.keys(S.seen).length;
 $("#app").innerHTML=`<h1>Progreso</h1>
 <div class="grid"><div class="card stat"><span class="mu">Capítulos leídos</span><div class="bigx">${Object.keys(S.lessons).length}/${CH.length}</div></div>
 <div class="card stat"><span class="mu">Tarjetas dominadas</span><div class="bigx">${learned}/${CARDS.length}</div></div>
 <div class="card stat"><span class="mu">Preguntas vistas</span><div class="bigx">${seen}/${Q.length}</div></div>
 <div class="card stat"><span class="mu">Simulacros</span><div class="bigx">${S.exams.length}</div></div></div>
 <div class="card"><b>Acierto por capítulo</b><table>${rows}</table></div>
 <div class="card"><b>Áreas débiles (menos de 70%)</b><div>${weak.length?weak.map(c=>`<div>• Cap. ${c.n} ${esc(c.t)} (${pct(c.id)}%) <a href="#" onclick="startQuiz('${c.id}',10);return false">practicar</a> · <a href="#" onclick="nav('capitulo','${c.id}');return false">releer</a></div>`).join(""):"<span class='mu'>Ninguna detectada aún. Practica para generar datos.</span>"}</div></div>
 <div class="row"><button class="btn sec" onclick="if(confirm('¿Borrar todo el progreso?')){try{localStorage.removeItem(KEY)}catch(e){}load();nav('inicio')}">Reiniciar progreso</button></div>`};


/* ---- Fuentes ---- */
const OFICIAL=[["Página oficial de la certificación PMP", "https://www.pmi.org/certifications/project-management-pmp"], ["PMBOK Guide 8.ª edición (PMI Bookstore)", "https://pmi.bookstore.ipgbook.com/a-guide-to-the-project-management-body-of-knowledge--pmbok---guide------eighth-edition-and-the-standard-for-project-management-products-9781628258295.php"]];
const YTQ="PMP PMBOK 8";
const yt=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
R.fuentes=()=>{
 $("#app").innerHTML=`<h1>Fuentes</h1><p class="mu">Enlaces para profundizar. Se abren en una pestaña nueva y requieren internet.</p>
 <h2>🏛️ Páginas oficiales de PMI</h2><div class="card">${OFICIAL.map(([t,u])=>`<div class="lk"><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a><span class="mu">${u.replace(/^https?:\/\//,"").slice(0,60)}</span></div>`).join("")}</div>
 <h2>▶️ Videos de YouTube por capítulo</h2><p class="mu">Son <b>búsquedas</b> en YouTube con palabras clave del capítulo: ordena por “relevancia” o “vistas” para ver los videos más destacados. No recomiendo un canal específico porque no los verifiqué uno por uno.</p>
 <div class="chgrid">${CH.map(c=>`<div class="card lkc"><b>${c.ic} Cap. ${c.n}</b><div class="mu">${esc(c.t)}</div><div class="row"><a class="btn sec" href="${yt(YTQ+" "+c.t.split(":")[0])}" target="_blank" rel="noopener">▶ Buscar en YouTube</a><a class="btn sec" href="${yt(YTQ+" "+c.t.split(":")[0]+" español")}" target="_blank" rel="noopener">En español</a></div></div>`).join("")}</div>
`};
nav("inicio");
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
