<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#101c2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIAControl Estudio: Oficina de Proyectos</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#667085;--pr:#2457d6;--pr2:#e8eefc;--ok:#157f4b;--okb:#e3f6ec;--ko:#b42318;--kob:#fde8e6;--wa:#b54708;--wab:#fff3e0;--bd:#e2e6ef;--a1:#dbe6ff;--a2:#d9f2e6;--a3:#ffe9cf;--a4:#f0e2ff;--sh:0 2px 8px rgba(20,35,80,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--card:#1a202c;--tx:#e8ecf4;--mu:#97a1b5;--pr:#7ea3ff;--pr2:#222d49;--ok:#5fd39a;--okb:#14352a;--ko:#ff8a80;--kob:#3a1c1a;--wa:#f5a85c;--wab:#3a2a15;--bd:#2c3547;--a1:#233559;--a2:#16392c;--a3:#4a3317;--a4:#35244f;--sh:none}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.65 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top{max-width:1000px;margin:auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.logo{font-weight:800;margin-right:auto;font-size:18px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{border:0;background:none;color:var(--mu);padding:7px 11px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--pr2);color:var(--pr);font-weight:700}
main{max-width:1000px;margin:auto;padding:18px 16px 70px}
h1{font-size:26px;margin:.2em 0 .4em;line-height:1.25}h2{font-size:21px;margin:1.5em 0 .4em}h3{font-size:17px;margin:.8em 0 .3em}
p{margin:.5em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mu{color:var(--mu);font-size:14px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--pr2);color:var(--pr)}.btn:disabled{opacity:.45;cursor:default}
.btn.big{padding:13px 22px;font-size:17px;background:#fff;color:#1d3fa1}.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn.good{background:var(--ok);color:#fff}.btn.bad{background:var(--ko);color:#fff}
.bar{height:9px;background:var(--pr2);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.bar.g i{background:var(--ok)}.bar.r i{background:var(--ko)}.bar.y i{background:var(--wa)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:var(--pr2);color:var(--pr);margin:0 4px 4px 0;font-weight:600}.tag.ok{background:var(--okb);color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row.end{margin-top:26px}.row.sp{justify-content:space-between}
select{font:inherit;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left}
.hero{background:linear-gradient(135deg,#1d3fa1,#4a7bff 60%,#7a5cff);color:#fff;border-radius:18px;padding:26px;display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0 0 6px;opacity:.95;max-width:520px}.hr{font-size:78px}
.stat .bigx{font-size:32px;font-weight:800;line-height:1.2}.stat .bigx.s{font-size:17px;line-height:1.35}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.chc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;box-shadow:var(--sh);transition:transform .12s}
.chc:hover{transform:translateY(-3px);border-color:var(--pr)}.chc.done{border-color:var(--ok)}
.cn{font-size:30px;display:flex;align-items:center;gap:8px}.cn small{font-size:13px;color:var(--mu);font-weight:700}
.chc h3{margin:.3em 0}.meta{margin-top:8px}
/* lectura */
.crumb{margin-bottom:8px}.crumb a{color:var(--pr);text-decoration:none}
.lesson{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px 24px;box-shadow:var(--sh)}
.lh{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px}.ic2{font-size:44px;line-height:1}
.lead{background:var(--pr2);border-radius:12px;padding:12px 14px;margin:6px 0 4px;font-size:17px}
.lesson h2{border-bottom:2px solid var(--pr2);padding-bottom:5px}
.cc{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.cx{background:var(--pr2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.cx:nth-child(4n+2){background:var(--a2)}.cx:nth-child(4n+3){background:var(--a3)}.cx:nth-child(4n+4){background:var(--a4)}
.cx .ic{font-size:26px;font-weight:800;line-height:1.1}.cx span{font-size:14px;color:var(--mu)}
.call{border-radius:12px;padding:12px 14px;margin:14px 0;border-left:5px solid var(--pr);background:var(--pr2)}
.call.ex{border-color:var(--ok);background:var(--okb)}.call.wa{border-color:var(--wa);background:var(--wab)}.call.eg{border-color:#8a5cf5;background:var(--a4)}
.call>b{display:block;margin-bottom:3px}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.vc{background:var(--a1);border-radius:12px;padding:12px 16px}.vc.alt{background:var(--a3)}.vc h3{margin-top:0}.vc ul{margin:0;padding-left:18px}.vc li{margin:4px 0}
.steps{display:grid;gap:8px;margin:12px 0}.st{display:flex;gap:12px;align-items:flex-start;background:var(--pr2);border-radius:12px;padding:10px 12px}
.st i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pr);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
.st span{display:block;color:var(--mu);font-size:14.5px}
.sum{background:linear-gradient(135deg,var(--okb),var(--pr2));border-radius:14px;padding:12px 18px;margin-top:22px}.sum ul{margin:6px 0 0;padding-left:20px}
.fig{margin:16px 0;background:var(--bg);border-radius:14px;padding:10px}.fig svg{width:100%;height:auto;display:block}
svg .t{font-size:12.5px;fill:var(--tx)}svg .tb{font-size:13.5px;font-weight:700;fill:var(--tx)}svg .tm{font-size:12px;fill:var(--mu)}
svg .s0{fill:var(--a4);stroke:#8a5cf5;stroke-width:1.5}svg .s1{fill:var(--a1);stroke:var(--pr);stroke-width:1.5}svg .s2{fill:var(--a2);stroke:var(--ok);stroke-width:1.5}svg .s3{fill:var(--a3);stroke:var(--wa);stroke-width:1.5}
svg .ln{stroke:var(--mu);stroke-width:1.6;fill:none}svg .ax{stroke:var(--mu);stroke-width:1.5}
svg .dot{fill:var(--card);stroke:var(--pr);stroke-width:3}svg .ring{fill:none;stroke:var(--bd);stroke-width:3;stroke-dasharray:6 6}
svg .nd{stroke-width:2}
svg .pv{fill:none;stroke:var(--pr);stroke-width:3}svg .ev{fill:none;stroke:var(--ok);stroke-width:3}svg .ac{fill:none;stroke:var(--ko);stroke-width:3}
details.cx summary,details.st summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:4px}
details.st summary{flex-direction:row;gap:12px;align-items:flex-start}
details summary::-webkit-details-marker{display:none}
details.cx{padding:12px}details.cx[open]{grid-column:1/-1}
.cx em,.st em{font-style:normal;font-size:12px;font-weight:700;color:var(--pr);margin-top:2px}
details[open]>summary em{display:none}
.dt{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);font-size:15.5px;line-height:1.65}
details.st{flex-direction:column;align-items:stretch;gap:0}
details.st .dt{margin-left:42px}
details.cx:hover,details.st:hover{box-shadow:0 0 0 2px var(--pr2)}
.toc{background:var(--bg);border-radius:12px;padding:10px 14px;margin:12px 0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px}
.toc a{color:var(--pr);text-decoration:none;font-weight:600}.toc a:hover{text-decoration:underline}
.lesson p{font-size:16.5px}
/* flash y cuestionario */
.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:21px;cursor:pointer;user-select:none;background:linear-gradient(135deg,var(--pr2),var(--a4));border-radius:18px;padding:22px;margin:12px 0;box-shadow:var(--sh)}
.flash.back{background:linear-gradient(135deg,var(--okb),var(--a1))}
.qh{display:flex;justify-content:space-between;align-items:center}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);padding:11px 12px;border-radius:11px;margin:8px 0;font:inherit;cursor:pointer}
.opt i{flex:none;width:26px;height:26px;border-radius:7px;background:var(--pr2);color:var(--pr);font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.opt:hover:not(:disabled){border-color:var(--pr)}.opt.sel{border-color:var(--pr);background:var(--pr2)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ko{background:var(--kob);border-color:var(--ko)}
.exp{background:var(--pr2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px}
.okt{color:var(--ok)}
.res{display:flex;gap:18px;align-items:center}.rg{position:relative;width:96px;height:96px;flex:none}.rg b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.rb{fill:none;stroke:var(--pr2);stroke-width:8}.rf{fill:none;stroke:var(--ok);stroke-width:8;stroke-linecap:round}
.card{overflow-x:auto}.reqc ul{margin:0 0 8px;padding-left:20px}.reqc li{margin:6px 0}.lk{display:flex;flex-direction:column;padding:8px 0;border-bottom:1px solid var(--bd)}.lk a{color:var(--pr);font-weight:600;text-decoration:none;word-break:break-word}.lkc .row{margin-top:8px}.lkc a.btn{text-decoration:none;font-size:14px}@media(max-width:560px){td,th{font-size:13.5px;padding:6px 4px}.hero{flex-direction:column;align-items:flex-start}.hr{display:none}.lesson{padding:16px}}
</style>
<style id="tema">/* ===== Tema VIAControl ===== */
:root{--bg:#f4f5f7;--card:#fff;--tx:#101c2a;--mu:#5a6470;--pr:#1d3250;--pr2:#e8ecf2;--ac:#c98a3d;--acb:#f8eedf;--bd:#dfe3ea;--wa:#9a6218;--wab:#fbf0dc;--a1:#e8ecf2;--a2:#f8eedf;--a3:#edf0f4;--a4:#f3e6d0;--btn:#101c2a;--btn-tx:#fff;--sh:0 2px 10px rgba(16,28,42,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0b141f;--card:#132033;--tx:#e9eef5;--mu:#93a1b3;--pr:#e2b06a;--pr2:#1d2c43;--ac:#d99b4c;--acb:#34291a;--bd:#28374d;--wa:#e2b06a;--wab:#34291a;--a1:#1b2b42;--a2:#3a2d1a;--a3:#203049;--a4:#33291b;--btn:#d99b4c;--btn-tx:#101c2a;--sh:none}}
body{background:var(--bg);color:var(--tx);letter-spacing:.005em}
header{border-bottom:0;box-shadow:0 3px 0 var(--ac),0 6px 16px rgba(16,28,42,.06)}
.top{padding:8px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--tx)}
.logo img{height:34px;width:auto;background:#fff;padding:4px 10px;border-radius:9px;display:block}
.logo span{font-size:14px;font-weight:700;color:var(--mu);border-left:2px solid var(--ac);padding-left:10px}
nav button{font-weight:600}
nav button.on{background:var(--pr2);color:var(--pr);box-shadow:inset 0 -3px 0 var(--ac)}
h1{letter-spacing:-.01em}
.btn{background:var(--btn);color:var(--btn-tx);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn.sec{background:var(--pr2);color:var(--pr);box-shadow:none}
.btn.big{background:var(--ac);color:#101c2a}.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.good{background:var(--ok);color:#fff}.btn.bad{background:var(--ko);color:#fff}
.bar{background:var(--pr2)}.bar i{background:var(--ac)}.bar.g i{background:var(--ok)}.bar.r i{background:var(--ko)}.bar.y i{background:var(--wa)}
.tag{background:var(--pr2);color:var(--pr)}.tag.ok{background:var(--okb);color:var(--ok)}
.hero{background-image:radial-gradient(circle at 92% -10%,rgba(201,138,61,.45),transparent 52%),linear-gradient(135deg,#101c2a,#344456);border-bottom:4px solid var(--ac);box-shadow:0 8px 24px rgba(16,28,42,.18)}
.hero h1{letter-spacing:-.02em}
.stat{border-top:3px solid var(--ac)}
.chc:hover{border-color:var(--ac)}.chc.done{border-color:var(--ok)}
.lesson h2{border-bottom:2px solid var(--ac);display:inline-block;padding-right:18px}
.lead{background:var(--acb);border-left:5px solid var(--ac)}
.call{background:var(--pr2);border-left-color:var(--pr)}.call.eg{background:var(--acb);border-left-color:var(--ac)}
.cx .ic{color:var(--pr)}
.st i{background:var(--btn);color:var(--btn-tx)}
.vc{background:var(--a1)}.vc.alt{background:var(--a2)}
.sum{background:linear-gradient(135deg,var(--okb),var(--acb))}
.fig{background:var(--bg)}
svg .s0{fill:var(--a4);stroke:var(--ac)}svg .s1{fill:var(--a1);stroke:var(--pr)}svg .s2{fill:var(--a3);stroke:var(--mu)}svg .s3{fill:var(--a2);stroke:#a56a1f}
svg .dot{stroke:var(--ac)}
.flash{background:linear-gradient(135deg,var(--pr2),var(--acb));border:1px solid var(--bd)}.flash.back{background:linear-gradient(135deg,var(--okb),var(--a1))}
.opt i{background:var(--pr2);color:var(--pr)}.opt:hover:not(:disabled){border-color:var(--ac)}.opt.sel{border-color:var(--ac);background:var(--acb)}
.exp{background:var(--pr2)}
.toc a{color:var(--pr)}
.crumb a{color:var(--pr)}
.lk a{color:var(--pr)}
details.cx:hover,details.st:hover{box-shadow:0 0 0 2px var(--ac)}
.cx em,.st em{color:var(--ac)}
::selection{background:var(--ac);color:#101c2a}
@media(max-width:560px){.logo span{display:none}.logo img{height:30px}}
</style>
<style>.aviso{background:var(--acb);border:1px solid var(--ac);border-left:6px solid var(--ac);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14.5px;line-height:1.55}.aviso p{margin:6px 0 0}.foot{max-width:1000px;margin:0 auto;padding:0 16px 40px;color:var(--mu);font-size:12.5px;text-align:center}</style>
</head>

<script>
/* ============ EXPLICACIONES AL HACER CLIC ============ */
const DETAILS={
"Temporal":"<b>Temporal no significa corto.</b> Significa que tiene un inicio y un final definidos. Un proyecto puede durar tres semanas o diez años; lo que importa es que termina. Termina cuando se alcanzan los objetivos, cuando ya no hay presupuesto o tiempo, cuando el cliente ya no lo necesita o cuando se decide cancelarlo. <i>Ejemplo:</i> construir un hospital es un proyecto (tiene fin); operar el hospital es una operación (continúa). Ojo: el resultado del proyecto sí puede durar décadas; lo temporal es el esfuerzo.",
"Único":"El producto, servicio o resultado es <b>distinto</b> a todo lo hecho antes, aunque se parezca. Dos casas con el mismo plano son proyectos diferentes porque cambian el terreno, el clima, el equipo, los proveedores y los riesgos. Que sea único es lo que obliga a planificar: no se puede aplicar una receta idéntica.",
"Elaboración progresiva":"Es ir <b>detallando el plan a medida que se tiene más información</b>. Al inicio sabes lo general (“un sistema de reportes”); a mitad ya sabes qué reportes y con qué datos. No es improvisar ni cambiar el alcance sin control: es refinar. En proyectos ágiles ocurre en cada iteración; en predictivos, mediante planificación por olas (detallar el corto plazo y dejar el largo plazo en alto nivel).",
"Crea valor":"El éxito final no se mide solo por entregar a tiempo y en presupuesto, sino por el <b>beneficio que genera</b> (ahorro, ingresos, cumplimiento, satisfacción). Un proyecto perfecto en tiempo y costo que nadie usa es un fracaso en valor. Por eso la PMO pregunta no solo “¿se entregó?”, sino “¿se logró el beneficio prometido?”. El PMBOK 8 pone el <b>valor</b> como uno de sus seis principios.",
"Integración":"Coordina todas las demás áreas para que el proyecto funcione como un todo. Incluye el acta de constitución, el plan para la dirección del proyecto, la dirección y el control del trabajo, y sobre todo el <b>control integrado de cambios</b>: ningún cambio de alcance, costo o plazo se aprueba aislado, porque afecta a los demás. Es la responsabilidad más característica del director de proyecto.",
"Alcance":"Define <b>qué se hará y qué no</b>. Se documenta en el enunciado del alcance y se descompone en la <b>EDT/WBS</b> (estructura de desglose del trabajo), que divide el entregable final en paquetes de trabajo manejables. El riesgo típico es el <i>scope creep</i>: agregar cosas sin control. La defensa es una línea base de alcance y un proceso formal de cambios.",
"Cronograma":"Define <b>cuándo</b> se hace cada actividad: se listan las actividades, se secuencian, se estiman duraciones y se calcula la <b>ruta crítica</b> (la cadena de actividades que determina la fecha mínima de fin; si una se atrasa, todo el proyecto se atrasa). Se controla comparando lo real con la línea base (ver SPI).",
"Costos":"Estima cuánto costará, arma el presupuesto (línea base de costos) y lo controla. La herramienta estrella para controlar es el <b>valor ganado</b> (EVM), que compara lo planificado, lo realizado y lo gastado. Incluye reservas para contingencias (riesgos conocidos) y gerenciales (riesgos desconocidos).",
"Calidad":"Asegura que los entregables cumplan los requisitos y sean <b>aptos para el uso</b>. Prevenir es más barato que corregir: se planifica la calidad, se asegura que los procesos funcionen y se controla con inspecciones y pruebas. A nivel PMO: auditorías, estándares y mejora de procesos. En el PMBOK 8, la calidad aparece como principio: se integra en los procesos y entregables, no se “inspecciona al final”.",
"Recursos":"Personas, equipos, materiales e instalaciones necesarios. Se trata de conseguirlos, asignarlos y liberarlos a tiempo. A nivel PMO se agrega la <b>gestión de capacidad</b>: sumar la demanda de todos los proyectos para detectar sobreasignación (una persona al 150%) y subutilización, y decidir prioridades.",
"Comunicaciones":"Asegura que la información correcta llegue a la persona correcta en el momento correcto. Se planifica quién necesita qué, con qué frecuencia y por qué medio. Una regla práctica: cuanto más alto el cargo, menos detalle y más decisiones. Una gran parte del trabajo del director de proyecto es comunicar.",
"Riesgos":"Un riesgo es un evento incierto que, si ocurre, afecta los objetivos (puede ser amenaza u <b>oportunidad</b>). Se identifica, se analiza (probabilidad × impacto), se planifican respuestas y se monitorea. Respuestas a amenazas: evitar, mitigar, transferir (seguros, contratos), aceptar. A nivel PMO se agrega la vista de <b>portafolio</b>: riesgos que se repiten en muchos proyectos, dependencias y concentración de riesgo.",
"Adquisiciones":"Compra o contratación de productos y servicios externos: planificar qué comprar, elegir proveedores, firmar contratos y administrarlos. Tipos de contrato: precio fijo (riesgo para el proveedor), costo reembolsable (riesgo para el comprador) y tiempo y materiales (intermedio). La PMO suele estandarizar plantillas y criterios de selección.",
"Interesados":"Un interesado es cualquier persona o grupo que afecta o es afectado por el proyecto. Se identifican, se analizan (poder, interés, actitud) y se planifica cómo involucrarlos. Un interesado ignorado suele convertirse en un riesgo mayor que uno técnico.",
"Valor planificado":"<b>PV</b>: cuánto trabajo, valorizado en dinero, <i>debería</i> estar terminado a la fecha de hoy según el plan. Es la referencia: si tu presupuesto era 100 y hoy debería llevarse 40% del trabajo, PV = 40.",
"Valor ganado":"<b>EV</b>: el valor presupuestado del trabajo que <i>realmente</i> se completó. Si el plan era 100 y realmente se completó 30% del trabajo, EV = 30. Se llama “ganado” porque es lo que el proyecto ya “ganó” al entregar. Es la base para medir tanto el costo como el cronograma.",
"Costo real":"<b>AC</b>: lo que efectivamente se gastó para hacer el trabajo completado. Si para ese 30% se gastaron 45, AC = 45. Comparado con EV muestra si estás gastando de más o de menos.",
"EV / AC":"<b>CPI</b> (índice de desempeño del costo). Mide cuánto valor obtienes por cada unidad gastada. Ejemplo: EV=30, AC=45 → CPI=0,67: por cada dólar gastado solo obtienes 67 centavos de trabajo. <b>Menor a 1 = sobre costo; mayor a 1 = bajo costo.</b>",
"EV / PV":"<b>SPI</b> (índice de desempeño del cronograma). Compara lo realizado con lo planificado. Ejemplo: EV=30, PV=40 → SPI=0,75: se avanza al 75% del ritmo previsto. <b>Menor a 1 = atrasado; mayor a 1 = adelantado.</b>",
"BAC / CPI":"<b>EAC</b>: estimación al concluir. Si el desempeño de costo actual se mantiene, el costo final será BAC/CPI. Ejemplo: BAC=1000, CPI=0,8 → EAC=1250. Sirve para avisar al patrocinador con anticipación si se necesitará más presupuesto.",
"Estandarizar":"Definir una forma común de hacer las cosas: ciclo de vida, plantillas, nomenclatura, criterios de aprobación. Permite comparar proyectos y reduce errores. Debe incluir <b>adaptación (tailoring)</b>: no se exige el mismo nivel de documentación a un proyecto de USD 20 mil que a uno de USD 20 millones.",
"Gobernar":"Establecer <b>quién decide qué</b>: comités, puertas de decisión (stage gates), umbrales de aprobación y rutas de escalamiento. Evita que las decisiones queden sin dueño o se tomen por presión. La gobernanza sin ejecutivos presentes en los comités es teatro.",
"Reportar":"Entregar visibilidad: estado de proyectos, programas y portafolio con datos comparables. Un buen reporte es breve, usa semáforos con criterios claros y <b>pide decisiones</b>. Un mal reporte es una colección de datos que nadie usa.",
"Capacitar":"Desarrollar competencias: cursos, coaching, mentoría y certificaciones. Es la función con mayor aceptación de los clientes, porque se percibe como ayuda y no como control.",
"Gestionar recursos":"Ver capacidad y demanda de toda la organización. Responde preguntas como: ¿podemos tomar este proyecto nuevo sin romper los actuales? ¿quién está sobreasignado? ¿qué habilidades faltan?",
"Gestionar conocimiento":"Capturar y reutilizar lo aprendido: lecciones aprendidas, repositorio de proyectos pasados, estimaciones reales vs. planeadas, plantillas probadas. El objetivo es no repetir errores y acelerar proyectos futuros.",
"Priorizar":"Ayudar a decidir qué proyectos hacer y en qué orden según estrategia, valor, riesgo y capacidad. Es una función estratégica: pasa de “gestionar proyectos bien” a “gestionar los proyectos correctos”.",
"Gestionar beneficios":"Asegurar que el valor prometido en el caso de negocio realmente ocurra: definir beneficios y métricas, asignar un dueño, medirlos después del proyecto y actuar si no aparecen.",
"Propósito":"Responde “¿para qué existe la PMO?”. Debe poder decirse en una frase y vincularse con un problema de negocio (por ejemplo: “reducir los sobrecostos de proyectos y dar visibilidad al comité ejecutivo”). Un propósito vago produce una PMO sin rumbo.",
"Alcance de servicios":"Qué hace la PMO y también qué <b>no</b> hace. Delimitarlo evita que se convierta en “la oficina de todo” y define expectativas con los clientes.",
"Autoridad":"Qué puede decidir o exigir la PMO (por ejemplo, rechazar un proyecto sin caso de negocio, pedir reportes, detener una puerta de decisión). La autoridad la otorga el patrocinador; sin ella la PMO solo puede sugerir.",
"Patrocinador":"El ejecutivo que respalda la PMO, aporta presupuesto y abre puertas. Debe tener jerarquía suficiente. Si cambia, hay que reconstruir el apoyo.",
"Métricas de éxito":"Cómo se sabrá si la PMO funciona: por ejemplo, % de proyectos en meta, tiempo de aprobación, satisfacción de clientes, beneficios realizados. Se definen desde el charter para poder demostrar valor después.",
"Presupuesto":"Cuánto cuesta operar la PMO (personas, herramientas, capacitación) y quién lo paga. Debe poder compararse con el valor que genera.",
"Ubicación":"Dónde reporta la PMO en la organización. Si reporta al director general o al comité ejecutivo, tiene más autoridad e independencia; si reporta a un área de TI, tiende a verse como una PMO de esa área.",
"Roles":"Un director de PMO (liderazgo y relación con ejecutivos), analistas o planificadores (datos, cronogramas, reportes), coaches o consultores (apoyo a directores de proyecto), administradores de herramientas y, a veces, directores de proyecto dedicados.",
"Financiamiento":"Dos modelos: <b>presupuesto central</b> (la organización financia la PMO como una función) o <b>cobro a los proyectos</b> (los proyectos pagan los servicios, lo que obliga a la PMO a justificar su valor). El cobro aumenta la rendición de cuentas pero puede reducir el uso del servicio.",
"Herramientas":"Software para cronogramas, portafolio, reportes y colaboración. Regla: <b>primero el proceso, después la herramienta</b>. Comprar software antes de definir cómo se trabaja automatiza el desorden.",
"Metodología":"El marco de trabajo: etapas, entregables, roles y plantillas. Debe permitir <b>adaptación</b> (proyectos grandes vs. pequeños, predictivos vs. ágiles) y estar documentada de forma sencilla.",
"Hoja de ruta":"El plan por fases para crear y hacer crecer la PMO: qué servicios primero, cuándo medir resultados, cuándo ampliar. Evita el “big bang” y permite ajustar con lo aprendido.",
"Reportes":"Operar reportes significa definir frecuencia, formato, responsables y fuente de datos. Los datos deben provenir de una <b>única fuente de verdad</b>; los semáforos, de criterios definidos (por ejemplo, rojo si el SPI es menor a 0,85).",
"Cambios":"Todo cambio pasa por <b>control integrado de cambios</b>: solicitud, evaluación de impacto (alcance, costo, plazo, riesgo), decisión por la instancia con autoridad y actualización de líneas base y documentos. La PMO suele administrar este proceso a nivel portafolio.",
"Conocimiento":"Al cierre de cada proyecto o fase, se capturan lecciones aprendidas, se archivan los documentos clave y se comparten en una biblioteca accesible. La PMO también organiza sesiones para difundir lo aprendido.",
"Automatización":"Usar herramientas para generar reportes, recordatorios y tableros automáticamente. Ahorra horas de trabajo manual y reduce errores. La automatización debe ir después de simplificar el proceso.",
"Analítica predictiva":"Usar datos históricos para anticipar desviaciones: qué proyectos tienen más probabilidad de atrasarse o exceder el costo. Puede apoyarse en inteligencia artificial, siempre revisando que los datos de origen sean confiables.",
"Agilidad":"Incorporar prácticas ágiles donde corresponda (entregas iterativas, retroalimentación frecuente). La PMO ágil acompaña a los equipos, mide valor entregado y evita imponer procesos pesados.",
"Escalar":"Extender servicios que funcionan a nuevas áreas o a más proyectos, cuidando que la calidad del servicio no baje. Se hace con evidencia de resultados.",
"Alta dirección":"Necesita pocas métricas, vinculadas a la estrategia, y decisiones concretas. Evita tecnicismos. Ejemplo: “la PMO ahorró USD 800 mil y redujo 18 días el tiempo de aprobación; solicitamos aprobar 2 analistas más”.",
"Directores de proyecto":"Necesitan ver qué ganan: menos trabajo repetitivo, plantillas útiles, apoyo en conflictos de prioridad. Si sienten que la PMO solo los controla, resisten.",
"Áreas de negocio":"Quieren saber cómo las iniciativas apoyan sus metas y cuándo recibirán beneficios. Se les comunica en lenguaje de negocio, no de gestión de proyectos.",
"Finanzas":"Les importan los beneficios, el ahorro y el ROI. Hay que respaldar las cifras con metodología clara y trabajar con sus datos.",
"Maneras de trabajar":"Antes “habilidades técnicas”. Incluye conocer y aplicar enfoques predictivos, ágiles e híbridos, y saber elegir el adecuado según el contexto.",
"Habilidades de poder":"Antes “liderazgo”. Son las habilidades interpersonales: comunicación, negociación, influencia, resolución de conflictos, pensamiento crítico y resolución de problemas.",
"Visión de negocio":"Entender la estrategia, la industria, los números y cómo el proyecto crea valor. Permite al profesional dialogar con ejecutivos y priorizar con criterio.",
"Responsabilidad":"Asumir las decisiones y sus consecuencias, cumplir los compromisos, reportar errores propios y respetar las leyes. Ejemplo: si descubres un error tuyo en un reporte ya enviado, lo corriges y avisas.",
"Respeto":"Tratar con dignidad a todos, respetar las diferencias culturales y los recursos de los demás, negociar de buena fe y no abusar del poder.",
"Equidad":"Decidir de forma imparcial y evitar conflictos de interés o favoritismo. Ejemplo: no adjudicar un contrato a un familiar sin declararlo.",
"Honestidad":"Decir la verdad, no engañar ni ocultar información relevante. Ejemplo: informar al patrocinador de un retraso aunque sea incómodo.",
"Alineación estratégica":"¿Contribuye el proyecto a un objetivo estratégico concreto? Si no se puede trazar, probablemente no debería priorizarse, por muy atractivo que parezca.",
"Valor financiero":"Beneficio económico esperado frente al costo: ROI, VAN, TIR y payback. Útil para comparar, pero no es el único criterio (hay proyectos obligatorios, regulatorios o estratégicos que no se justifican solo por finanzas).",
"Riesgo":"Probabilidad e impacto de que algo salga mal, y la exposición total del portafolio. Se busca un equilibrio: demasiados proyectos de bajo riesgo no generan crecimiento; demasiados de alto riesgo ponen en peligro a la organización.",
"Capacidad":"¿Hay personas, presupuesto y atención ejecutiva para hacerlo bien sin dañar otros proyectos? Un proyecto excelente que no se puede ejecutar por falta de capacidad se difiere.",
"Retorno sobre inversión":"<b>ROI = beneficio neto / costo</b>, donde beneficio neto = beneficios totales − costo. Si inviertes 100 y el beneficio neto es 40 (por ejemplo, ingresos de 140), el ROI es 40%. Fácil de entender, pero no considera el valor del dinero en el tiempo.",
"Valor actual neto":"<b>VAN (NPV)</b>: valor presente de los flujos futuros menos la inversión inicial, usando una tasa de descuento. Si es mayor a 0, el proyecto rinde más que el costo de capital. Si es 0, rinde exactamente esa tasa. Sirve para comparar proyectos.",
"Tasa interna de retorno":"<b>TIR (IRR)</b>: la tasa de descuento que hace que el VAN sea 0. Se interpreta como “el rendimiento anual del proyecto”. Si es mayor a la tasa exigida por la organización, conviene.",
"Payback":"Tiempo que tarda en recuperarse la inversión. Fácil de entender, pero ignora lo que ocurre después de recuperar la inversión y no considera el valor del dinero en el tiempo."
};
const STEPDET={
"Generar conciencia":"Muchas organizaciones no saben cuánto les cuestan los problemas de gestión de proyectos. Aquí se presentan <b>datos concretos</b>: porcentaje de proyectos atrasados, sobrecostos acumulados, iniciativas sin beneficios. El objetivo es que los ejecutivos vean el problema y quieran resolverlo, no que acepten una solución impuesta.",
"Identificar interesados":"Mapea quién decide, quién se beneficia, quién puede bloquear y quién debe cambiar su forma de trabajar. Se entrevistan los más influyentes. Un interesado clave omitido suele reaparecer más tarde como oposición.",
"Evaluar necesidades":"Se escucha a los clientes de la PMO: ¿qué les duele? ¿qué esperan? Técnicas: entrevistas, encuestas, talleres, revisión de proyectos pasados. Se priorizan los dolores más graves y más fáciles de resolver (victorias tempranas).",
"Evaluar cultura y madurez":"¿Cómo se toman decisiones? ¿Hay tolerancia a controles? ¿Se comparten los problemas o se ocultan? Además se mide madurez con un modelo reconocido para saber desde dónde se parte. Esto define qué tipo de PMO es realista.",
"Alinear con la estrategia":"Se vincula lo que hará la PMO con los objetivos de la organización. Ejemplo: si la estrategia es crecer vía nuevos productos, la PMO prioriza visibilidad y velocidad del portafolio de innovación.",
"Decidir (caso de negocio)":"Se presenta el caso de negocio con opciones (no hacer nada, PMO de apoyo, PMO de control...), costos, beneficios, riesgos y recomendación. La decisión de continuar o no se toma con evidencia.",
"Piloto":"Probar los servicios con uno o dos proyectos voluntarios. Se aprende qué funciona, se corrigen plantillas y se obtienen testimonios positivos que ayudan a la adopción posterior.",
"Onboarding":"Reunir a directores y equipos, explicar qué servicios ofrece la PMO, qué se espera de ellos, cómo pedir ayuda y qué beneficios obtendrán. Incluye capacitación breve y material de consulta.",
"Despliegue por oleadas":"Ampliar por grupos de proyectos o áreas, no todos a la vez. Cada oleada incorpora lo aprendido de la anterior. Reduce la resistencia y el riesgo de saturar a la PMO.",
"Operación estable":"Los servicios funcionan de forma recurrente con indicadores y un calendario claro (reportes mensuales, comités trimestrales). Se pasa de “proyecto de implantación” a “operación”.",
"Medir":"Definir indicadores de servicio (tiempo de respuesta, satisfacción) y de resultado (proyectos en meta). Sin datos, la mejora es opinión.",
"Escuchar":"Encuestas cortas, entrevistas y reuniones con clientes internos. Pregunta qué servicios usan, cuáles no y por qué. Cierra el ciclo contando qué se hizo con sus comentarios.",
"Analizar causa raíz":"Buscar el origen del problema con técnicas como los 5 porqués o el diagrama de Ishikawa. Ejemplo: si los reportes llegan tarde, quizá el problema no es la gente sino que los datos están en 5 sistemas distintos.",
"Actuar":"Implementar el cambio: simplificar, automatizar, capacitar, eliminar o crear servicios. Se comunica el cambio y se explica por qué se hace.",
"Verificar":"Comprobar con datos si el cambio funcionó. Si no, se ajusta (ciclo PDCA: planificar, hacer, verificar, actuar).",
"Formación":"El equipo se está conociendo. Hay cortesía, incertidumbre y dependencia del líder. Se necesita dirección clara, objetivos y roles definidos.",
"Tormenta":"Aparecen conflictos sobre roles, métodos y poder. Es normal y puede ser productivo si se gestiona. El líder facilita el diálogo y establece reglas de convivencia.",
"Normalización":"Se acuerdan normas, se desarrolla confianza y comienza la colaboración real. El líder delega más y fortalece la identidad del equipo.",
"Desempeño":"El equipo trabaja con autonomía, resuelve problemas por sí mismo y logra resultados superiores. El líder remueve obstáculos y reconoce logros.",
"Definir":"Describir con precisión el beneficio, para quién es, cómo se medirá, cuál es la línea base actual y cuál es la meta. Un beneficio mal definido no puede gestionarse.",
"Planificar":"Asignar un <b>dueño</b> del beneficio (alguien del negocio, no del proyecto), fechas y actividades para realizarlo (por ejemplo: capacitar usuarios, cambiar procesos). El proyecto entrega la capacidad; el negocio realiza el beneficio.",
"Realizar":"Ejecutar el proyecto y las actividades de cambio para que el beneficio empiece a materializarse. Se monitorea periódicamente y se corrige el rumbo.",
"Sostener":"Después del proyecto, el beneficio se mantiene si hay procesos, personas y métricas que lo respalden. La PMO sigue midiendo hasta confirmarlo."
};

b:()=>
H("1. ¿Qué es un proyecto?")+
P("Un <b>proyecto</b> es un esfuerzo <b>temporal</b> emprendido para crear un producto, servicio o resultado <b>único</b>. Tiene inicio y fin definidos, y termina cuando se logran los objetivos, se agota el presupuesto o se decide cancelarlo. Lo opuesto son las <b>operaciones</b>: trabajo continuo y repetitivo que mantiene el negocio funcionando (por ejemplo, atender el soporte diario).")+
CC([["⏳","Temporal","Tiene fecha de inicio y de fin."],["✨","Único","El resultado es distinto a lo hecho antes, aunque haya similitudes."],["📈","Elaboración progresiva","Se detalla a medida que se conoce más información."],["🎯","Crea valor","Se justifica por el beneficio para el negocio, no solo por entregar."]])+
H("2. ¿Qué es la dirección de proyectos y qué es el PMBOK?")+
P("La <b>dirección de proyectos</b> es la aplicación de conocimientos, habilidades, herramientas y técnicas para cumplir los requisitos del proyecto. El <b>PMBOK® Guide</b> (Project Management Body of Knowledge) es el estándar de buenas prácticas de PMI sobre cómo hacerlo. <b>No es una metodología</b> que se sigue paso a paso: es un marco de referencia que cada organización adapta (tailoring).")+
CALL("wa","Tu mensaje mencionó “PMOPBK”. El nombre correcto es <b>PMBOK</b> (de proyectos). La PMO tiene su propia guía de PMI, la <b>PMO Practice Guide</b>. Son documentos diferentes que se complementan.")+
P("<b>Tres ediciones, tres formas de organizar lo mismo:</b>")+
VS(["PMBOK 8.ª edición (la vigente)",["<b>6 principios</b>: visión holística, enfoque en el valor, calidad integrada en procesos y entregables, liderazgo responsable, sostenibilidad en todas las áreas y cultura empoderada","<b>7 dominios de desempeño</b>: gobernanza, alcance, cronograma, finanzas, interesados, recursos y riesgo","<b>40 procesos</b> presentados de forma no prescriptiva","Incluye más contenido sobre IA, PMO y adquisiciones; integra el Standard for Project Management en el mismo volumen"]],["Ediciones anteriores",["<b>6.ª</b>: 5 grupos de procesos, 10 áreas de conocimiento y 49 procesos","<b>7.ª</b>: 12 principios y 8 dominios de desempeño (interesados, equipo, enfoque de desarrollo y ciclo de vida, planificación, trabajo del proyecto, entrega, medición, incertidumbre)","Las áreas de conocimiento de la 6.ª siguen siendo útiles para entender el contenido"]])+

P("Una <b>PMO</b> (Oficina de Gestión de Proyectos, Programas o Portafolio) es una estructura organizacional que estandariza los procesos de gobernanza y facilita el intercambio de recursos, metodologías, herramientas y técnicas relacionadas con proyectos. Su razón de ser es <b>entregar valor</b> a la organización.")+
H("2. Tipos de PMO: un espectro de control")+DG.espectro()+
VS(["De apoyo",["Rol consultivo","Ofrece plantillas, lecciones y capacitación","Ideal en culturas autónomas o al comenzar"]],["De control",["Exige uso de metodología y reportes","Audita el cumplimiento","Ideal cuando se necesita consistencia"]])+
CALL("tip","La <b>PMO directiva</b> gestiona los proyectos directamente (los directores le reportan). No hay un tipo “mejor”: se elige según cultura, madurez y problemas que se quieren resolver.")+
P("Además existen PMO <b>empresarial o estratégica</b> (portafolio), <b>de departamento</b>, <b>de proyecto</b> (temporal, para un proyecto grande) y la <b>PMO ágil / centro de excelencia</b>.")+
H("3. Funciones principales")+
CC([["📏","Estandarizar","Metodología, plantillas, procesos."],["🏛️","Gobernar","Criterios de decisión, comités, puertas."],["📊","Reportar","Estado de proyectos y portafolio."],["🧑‍🏫","Capacitar","Coaching y mentoría a directores."],["🗂️","Gestionar recursos","Capacidad y asignación."],["📚","Gestionar conocimiento","Lecciones aprendidas."],["⚖️","Priorizar","Alineación con la estrategia."],["💎","Gestionar beneficios","Que el valor prometido se realice."]])+
H("4. PMO centrada en el cliente y el ciclo de valor")+
P("El material oficial de preparación de PMI organiza el recorrido de una PMO en <b>seis etapas</b> que giran como un volante (<i>flywheel</i>): cuanto más valor percibe el cliente, más apoyo recibe la PMO, y más puede mejorar. Estas etapas son los capítulos 1 a 6 de este portal.")+DG.flywheel()+
CALL("tip","Los “clientes” de la PMO son los directores de proyecto, los patrocinadores, los ejecutivos y las áreas de negocio. Si ellos no perciben valor, la PMO se vuelve burocracia y pierde apoyo.")+
CALL("wa","Una PMO que solo “exige reportes” sin dar nada a cambio es el error clásico. Siempre debes poder responder: <b>¿qué problema real resolvemos y para quién?</b>")+
DEEP("c1")+SUM(["La PMO estandariza, gobierna, reporta, capacita y prioriza.","Tipos: de apoyo, de control y directiva; el tipo depende del contexto.","La PMO se justifica por valor medible para sus clientes internos.","El recorrido: Introducción → Exploración → Diseño → Despliegue → Mejora → Realización."])},

{id:"c2",n:2,ic:"🔍",t:"Exploración: necesidades, cultura y alineación",ex:"Dominio Organizational Development & Alignment (16%)",min:25,
sub:"Antes de crear o rediseñar una PMO hay que entender a la organización: qué duele, quién decide y cómo se trabaja aquí.",
b:()=>
H("1. ¿Por qué explorar primero?")+
P("Muchas PMO fracasan porque se diseñan desde una plantilla externa sin entender el contexto. La exploración genera <b>conciencia</b> de la necesidad, <b>diagnostica</b> el estado actual y <b>alinea</b> expectativas con la estrategia.")+
STEPS([["Generar conciencia","Mostrar con datos el problema: sobrecostos, atrasos, proyectos que no aportan valor."],["Identificar interesados","Patrocinador, ejecutivos, directores de proyecto, áreas de negocio, TI, finanzas."],["Evaluar necesidades","Entrevistas, encuestas, revisión de proyectos pasados: ¿cuáles son los dolores más críticos?"],["Evaluar cultura y madurez","¿Es jerárquica o colaborativa? ¿Qué tanta disciplina de proyectos existe?"],["Alinear con la estrategia","Conectar la PMO con los objetivos de la organización."],["Decidir (caso de negocio)","Presentar opciones, costos y beneficios para obtener la decisión."]])+
H("2. Cultura organizacional")+
VS(["Cultura jerárquica / formal",["Valora procesos, aprobaciones y reportes","Una PMO de control suele encajar","Riesgo: rigidez y lentitud"]],["Cultura colaborativa / ágil",["Valora autonomía y rapidez","Una PMO de apoyo o ágil encaja mejor","Riesgo: falta de consistencia y visibilidad"]])+
CALL("tip","La PMO debe <b>ajustarse a la cultura</b> (o cambiarla gradualmente con apoyo del patrocinador), no ignorarla.")+
H("3. Interesados y patrocinio")+
P("Usa la <b>matriz poder/interés</b> para decidir cómo involucrar a cada grupo: <i>alto poder / alto interés</i> = gestionar de cerca; <i>alto poder / bajo interés</i> = mantener satisfecho; <i>bajo poder / alto interés</i> = mantener informado; <i>bajo / bajo</i> = monitorear. Sin un <b>patrocinador ejecutivo</b> con autoridad, la PMO no puede sostenerse.")+
H("4. Madurez organizacional")+
P("Los modelos de madurez (OPM3, P3M3, CMMI y otros) ayudan a diagnosticar qué tan consistentes y medidos son los procesos. La madurez baja pide una PMO sencilla y de apoyo; la madurez alta permite una PMO más estratégica.")+
CALL("eg","Un banco regional pide una PMO. Tras entrevistas se descubre que los directores trabajan solos, no hay reportes comparables y TI no sabe qué prioridades tiene el negocio. La conclusión: empezar con una PMO de apoyo con reporte único de portafolio, no con auditorías pesadas.")+
CALL("ex","Cuando la pregunta describe una organización nueva en gestión de proyectos, la mejor respuesta suele ser <b>diagnosticar primero y empezar simple</b>, con victorias tempranas, antes de imponer controles.")+
DEEP("c2")+SUM(["Explorar = entender necesidades, cultura, madurez e interesados.","El patrocinio ejecutivo es condición de supervivencia.","Ajusta el tipo de PMO a la cultura y madurez.","El caso de negocio justifica la decisión de crear o evolucionar la PMO."])},

{id:"c3",n:3,ic:"📐",t:"Diseño: propuesta de valor, charter, servicios y gobernanza",ex:"Dominios PMO Design & Structuring (18%) y Strategic Elements (18%)",min:30,
sub:"Cómo se diseña una PMO: qué servicios ofrece, cómo se organiza, quién decide y cómo se financia.",
b:()=>
H("1. Propuesta de valor")+
P("Define <b>qué problemas resuelve la PMO, para quién y con qué resultado</b>. Todo el diseño se deriva de esta propuesta. Incluye visión, misión, objetivos y los beneficios esperados.")+
H("2. Acta de constitución (charter) de la PMO")+
CC([["🎯","Propósito","Por qué existe."],["📦","Alcance de servicios","Qué hace y qué no."],["🏛️","Autoridad","Qué puede decidir o exigir."],["🧑‍💼","Patrocinador","Quién la respalda."],["📏","Métricas de éxito","Cómo se sabrá si funciona."],["💵","Presupuesto","Cómo se financia."]])+
H("3. Catálogo de servicios")+
P("Lista de servicios con su descripción, destinatarios y nivel de servicio. Ejemplos: reporte de portafolio, metodología y plantillas, gestión de capacidad, auditorías de proyecto, capacitación, coaching, mesa de ayuda, gestión de lecciones aprendidas.")+
CALL("tip","Empieza con <b>pocos servicios de alto valor</b>; crece cuando los clientes los pidan. Un catálogo enorme desde el día uno genera resistencia.")+
H("4. Gobernanza")+
P("Define <b>quién decide qué</b>, con qué criterios y en qué foro: comité de dirección, puertas de decisión (<i>stage gates</i>), proceso de aprobación de cambios y escalamiento de problemas. Una <b>matriz RACI</b> aclara Responsable, Aprobador, Consultado e Informado.")+
H("5. Estructura y modelo operativo")+
CC([["🏢","Ubicación","Cuanto más cerca de la alta dirección, más autoridad."],["👥","Roles","Director de PMO, analistas, planificadores, coaches."],["💰","Financiamiento","Presupuesto central o cobro a los proyectos."],["🧰","Herramientas","Primero el proceso; luego el software."],["🧵","Metodología","Marco con adaptación (tailoring) por tamaño y riesgo."],["🗺️","Hoja de ruta","Implantación por fases."]])+
CALL("wa","Comprar una herramienta de gestión de portafolio antes de definir procesos es un error muy frecuente: automatizas el desorden.")+
CALL("ex","Para preguntas de diseño busca: <b>charter aprobado, servicios alineados a necesidades, gobernanza clara y plan por fases</b>. Evita respuestas que implican copiar el modelo de otra empresa sin adaptarlo.")+
DEEP("c3")+SUM(["Primero la propuesta de valor; luego servicios, gobernanza y estructura.","El charter formaliza propósito, alcance, autoridad y patrocinio.","El catálogo debe ser pequeño al inicio y crecer con la demanda.","El tailoring evita burocracia innecesaria."])},

{id:"c4",n:4,ic:"🚀",t:"Despliegue: poner en marcha y operar la PMO",ex:"Dominio PMO Operation & Performance (15%)",min:30,
sub:"Cómo se lanza la PMO, cómo se incorpora a los proyectos y cómo se opera el día a día.",
b:()=>
H("1. Lanzar sin “big bang”")+
STEPS([["Piloto","Probar los servicios en uno o dos proyectos y ajustar."],["Onboarding","Presentar a los directores y equipos qué recibirán y qué se espera."],["Despliegue por oleadas","Extender gradualmente a más áreas."],["Operación estable","Servicios recurrentes con indicadores."]])+
H("2. Operación diaria de los servicios")+
CC([["📊","Reportes","Pocos, claros, con semáforos y decisiones requeridas."],["⚡","Riesgos","Registro de portafolio; escalamiento."],["🗂️","Recursos","Capacidad vs. demanda para evitar sobreasignación."],["🔄","Cambios","Control integrado y actualización de líneas base."],["✅","Calidad","Auditorías y revisiones de proyecto."],["📚","Conocimiento","Lecciones aprendidas y repositorio."]])+
CALL("tip","Una <b>única fuente de verdad</b>: los datos oficiales viven en un solo repositorio. Así se evitan reportes contradictorios y debates sobre qué cifra es la buena.")+
H("3. Medir el desempeño de proyectos")+
DG.evm()+
P("La PMO consolida el valor ganado de los proyectos: <b>CPI</b> y <b>SPI</b> por debajo de 1 son señales de alerta. Distingue indicadores <b>adelantados</b> (predicen, p. ej. riesgos abiertos o tendencia del SPI) de <b>rezagados</b> (confirman, p. ej. costo final).")+
H("4. Gestión de la demanda")+
P("La PMO recibe solicitudes de nuevos proyectos y las evalúa contra criterios, capacidad y estrategia antes de aprobarlas. Aceptar todo lo que piden las áreas es la forma más rápida de sobrecargar la organización.")+
CALL("eg","El comité muestra 12 iniciativas nuevas. La PMO consulta la capacidad: solo hay recursos para 5 sin romper proyectos en curso. Presenta una priorización con criterios y propone diferir las demás.")+
CALL("ex","En preguntas de escenario sobre operación, la respuesta correcta suele combinar <b>datos objetivos + escalamiento oportuno + proceso formal de cambios</b>, no soluciones improvisadas.")+
DEEP("c4")+SUM(["Lanza con piloto y onboarding; evita el big bang.","Servicios clave: reportes, riesgos, recursos, cambios, calidad y conocimiento.","Una única fuente de verdad evita reportes contradictorios.","Gestiona demanda contra capacidad y estrategia."])},

{id:"c5",n:5,ic:"🔧",t:"Mejora: efectividad y madurez continua",ex:"Dominio PMO Enhancement & Effectiveness (18%)",min:20,
sub:"Una PMO no está terminada: se mide, se escucha a los clientes y se mejora de forma sistemática.",
b:()=>
H("1. El ciclo de mejora")+
STEPS([["Medir","Indicadores de servicio y de resultados de proyectos."],["Escuchar","Encuestas, entrevistas y retroalimentación de clientes internos."],["Analizar causa raíz","Atacar el origen, no el síntoma."],["Actuar","Ajustar, simplificar, eliminar o crear servicios."],["Verificar","Comprobar si la mejora funcionó (ciclo PDCA)."]])+
H("2. Madurez")+
P("Reevalúa la madurez periódicamente con un modelo reconocido. Identifica brechas, define el siguiente nivel realista y actualiza la hoja de ruta. Subir de madurez no es acumular procesos, sino hacerlos <b>más efectivos y medibles</b>.")+
H("3. Lecciones aprendidas")+
CALL("wa","Archivar lecciones no es aprenderlas. Valen cuando se <b>analizan, se convierten en acciones y se aplican</b> en proyectos futuros.")+
H("4. Retirar lo que no aporta")+
P("Mejorar también es <b>simplificar</b>: si un servicio, reporte o plantilla ya no genera valor, ajústalo o ciérralo. Esto libera capacidad y mejora la percepción de la PMO.")+
H("5. Innovación")+
CC([["🤖","Automatización","Reportes y tableros automáticos."],["🔮","Analítica predictiva","Anticipar desviaciones."],["🌱","Agilidad","Adoptar prácticas ágiles donde corresponda."],["🌐","Escalar","Extender servicios a nuevas áreas."]])+
CALL("ex","Si el escenario describe una PMO con quejas de burocracia, la mejor acción es <b>escuchar, medir, simplificar y volver a comunicar el valor</b>, no endurecer controles.")+
DEEP("c5")+SUM(["Mejora = medir, escuchar, analizar causa raíz, actuar y verificar.","La madurez se reevalúa de forma periódica.","Las lecciones aprendidas se aplican, no se archivan.","Retirar servicios sin valor también es mejorar."])},

{id:"c6",n:6,ic:"💎",t:"Realización: medir y comunicar el valor",ex:"Dominios PMO Enhancement (18%) y Operation (15%)",min:20,
sub:"Si no puedes demostrar el valor de la PMO, no sobrevivirá. Este capítulo trata de medirlo y comunicarlo.",
b:()=>
H("1. ¿Qué es “valor” para una PMO?")+
P("Valor es el beneficio que la organización y sus clientes reciben gracias a la PMO: proyectos más exitosos, decisiones más rápidas, menos desperdicio, mejor uso de recursos y beneficios estratégicos realizados.")+
H("2. Qué medir")+
VS(["Indicadores de la PMO",["% de proyectos que cumplen objetivos","Cumplimiento de la metodología","Satisfacción de clientes internos","Tiempo de decisión de aprobaciones","Beneficios realizados"]],["Indicadores financieros",["ROI (retorno sobre la inversión)","VAN / NPV (valor presente neto)","TIR / IRR","Payback (período de recuperación)","Costo de la PMO vs. ahorros generados"]])+
CALL("tip","Mide <b>resultados</b> (qué cambió gracias a la PMO), no solo <b>actividad</b> (cuántas reuniones o plantillas hubo).")+
H("3. Comunicar a los interesados")+
CC([["🧑‍💼","Alta dirección","Pocas métricas, impacto en estrategia, decisiones requeridas."],["🧑‍🏫","Directores de proyecto","Qué ganan: menos trabajo repetitivo, apoyo."],["🏢","Áreas de negocio","Cómo las iniciativas apoyan sus metas."],["🧾","Finanzas","Beneficios, ahorros y ROI."]])+
P("Adapta el mensaje: tableros visuales, historias de éxito con datos y un resumen ejecutivo claro. Cuenta qué problema había, qué hizo la PMO y qué resultado se logró.")+
H("4. Sostener el valor")+
P("Comparte los logros de forma periódica, renueva el apoyo del patrocinador y vincula los beneficios con dueños y métricas en el tiempo. El valor que no se comunica, no existe para quien decide.")+
CALL("eg","Un tablero trimestral muestra: proyectos en meta subió de 42% a 61%, el tiempo de aprobación bajó de 30 a 12 días y se ahorraron USD 800 mil evitando dos proyectos duplicados. Con eso, el patrocinador aprueba ampliar el equipo.")+
CALL("ex","La respuesta correcta suele <b>vincular las métricas de la PMO con objetivos estratégicos</b> y comunicarlas al nivel adecuado de cada audiencia.")+
DEEP("c6")+SUM(["Valor = beneficios medibles para la organización y sus clientes.","Mide resultados, no solo actividad.","Adapta la comunicación a cada interesado.","El valor se sostiene comunicándolo de forma continua."])},

{id:"c7",n:7,ic:"🤝",t:"Personas: liderazgo, equipos y ética",ex:"Dominio People (15%)",min:20,
sub:"Una PMO funciona gracias a personas: sus competencias, su liderazgo y su forma de colaborar.",
b:()=>
H("1. El triángulo de talento de PMI")+
CC([["🛠️","Maneras de trabajar","Técnicas, metodologías, ágil, predictivo, híbrido."],["🌟","Habilidades de poder","Liderazgo, comunicación, negociación, inteligencia emocional."],["🏆","Visión de negocio","Estrategia, valor y entendimiento del negocio."]])+
P("Una PMO necesita personas fuertes en <b>las tres</b> áreas. Cuando solo se tienen habilidades técnicas, los proyectos se entregan pero no se influye en las decisiones del negocio.")+
H("2. Liderar vs. gestionar")+
VS(["Gestionar",["Planifica, organiza y controla","Se enfoca en procesos y resultados","Reduce variación"]],["Liderar",["Inspira, alinea y motiva","Se enfoca en personas y visión","Impulsa el cambio"]])+
H("3. Equipos y conflictos")+
STEPS([["Formación","Los miembros se conocen y buscan orientación."],["Tormenta","Aparecen conflictos y se disputan roles."],["Normalización","Se acuerdan reglas y se colabora."],["Desempeño","El equipo trabaja con autonomía y eficacia."]])+
P("Para resolver conflictos, la técnica más sostenible es <b>colaborar / resolver el problema</b>. Forzar o evitar sirve en casos puntuales, pero deja problemas sin resolver.")+
H("4. Desarrollar a las personas")+
P("La PMO ofrece capacitación, mentoría, rutas de carrera para directores de proyecto y una <b>comunidad de práctica</b> donde se comparten experiencias. También gestiona su propio equipo con delegación clara de expectativas y autoridad.")+
H("5. Ética profesional")+
CC([["🛡️","Responsabilidad","Asumir decisiones y sus consecuencias."],["🙏","Respeto","Tratar con dignidad a todos."],["⚖️","Equidad","Decidir sin conflicto de intereses ni favoritismo."],["🔎","Honestidad","Decir la verdad y no engañar."]])+
CALL("ex","En preguntas de ética, la respuesta correcta casi siempre es la <b>transparente</b>: informar el problema, evitar conflictos de intereses y no ocultar información al patrocinador.")+
DEEP("c7")+SUM(["Tres áreas del triángulo de talento: técnico, liderazgo y negocio.","Gestionar controla; liderar inspira. La PMO necesita ambos.","Resolver conflictos colaborando es la mejor práctica general.","La ética de PMI: responsabilidad, respeto, equidad y honestidad."])},

{id:"c8",n:8,ic:"📊",t:"Estrategia, portafolio y beneficios",ex:"Dominio PMO Strategic Elements (18%)",min:25,
sub:"La PMO conecta la estrategia con la ejecución: decide qué proyectos hacer, en qué orden y cómo asegurar los beneficios.",
b:()=>
H("1. De la estrategia a los proyectos")+DG.jerarquia()+
P("Cada iniciativa debe poder <b>trazarse</b> a un objetivo estratégico. Si no, probablemente no debería hacerse.")+
H("2. Selección y priorización")+
CC([["🎯","Alineación estratégica","¿Apoya los objetivos?"],["💵","Valor financiero","ROI, VAN, TIR, payback."],["⚡","Riesgo","Probabilidad e impacto."],["🧑‍🔧","Capacidad","¿Hay recursos disponibles?"]])+
CALL("tip","Prioriza con <b>criterios objetivos y transparentes</b>. Decidir por simpatía o por quién grita más es el error más común.")+
H("3. Balance del portafolio")+
P("Un buen portafolio equilibra corto y largo plazo, riesgo alto y bajo, crecimiento y mantenimiento. Detener un proyecto que ya no es viable <b>es un buen resultado</b>: el costo hundido no debe influir en la decisión.")+
H("4. Gestión de beneficios")+
STEPS([["Definir","Qué beneficio, para quién, con qué métrica."],["Planificar","Quién es el dueño y cuándo se espera."],["Realizar","Ejecutar para que el beneficio ocurra."],["Sostener","Mantenerlo después del proyecto."]])+
H("5. Medidas financieras")+
CC([["ROI","Retorno sobre inversión","(Beneficio − costo) / costo."],["VAN","Valor actual neto","Mayor a 0 = crea valor."],["TIR","Tasa interna de retorno","Tasa que hace VAN = 0."],["⏱️","Payback","Tiempo para recuperar la inversión."]])+
CALL("ex","Si dos proyectos compiten, la respuesta más defendible usa <b>criterios definidos y alineados a la estrategia</b>; el que tiene mayor VAN no siempre gana si no está alineado o excede la capacidad.")+
DEEP("c8")+SUM(["Todo proyecto debe trazarse a la estrategia.","Prioriza con criterios objetivos: estrategia, valor, riesgo y capacidad.","Balancea el portafolio y detén lo no viable.","Los beneficios tienen dueño, métrica y seguimiento."])}
];
const DEEPT={
c0:`<h2>En profundidad: los principios y dominios del PMBOK 8</h2>
<p>La 8.ª edición reorganiza el conocimiento en <b>6 principios</b> (cómo pensar y comportarse) y <b>7 dominios de desempeño</b> (qué áreas gestionar). Los principios son los siguientes. Cada uno se puede abrir con clic.</p>
<div class="cc">${[["🌐","Adopta una visión holística","Ver el proyecto como parte de un sistema: sus componentes, dependencias, interesados y entorno. Una decisión en alcance afecta costo, riesgo y equipo. Ejemplo: acelerar una entrega puede sobrecargar al equipo y bajar la calidad; la visión holística obliga a mirar ese efecto antes de decidir."],["💎","Enfócate en el valor","El valor es el motivo de existir del proyecto. Se define con el patrocinador, se mide y se revisa durante todo el ciclo de vida. Si el valor desaparece (cambió el mercado, la ley o la prioridad), se replantea o se detiene el proyecto."],["✅","Integra la calidad en procesos y entregables","La calidad no se “agrega al final”: se define desde los requisitos, se previene con buenos procesos y se verifica de forma continua. Cuesta menos prevenir que corregir."],["🧭","Sé un líder responsable","Combina liderazgo y gestión responsable (<i>stewardship</i>): actuar con integridad, cuidar los recursos y responder por las decisiones. Se vincula con la ética profesional."],["🌱","Integra la sostenibilidad en todas las áreas","Considerar impactos ambientales, sociales y económicos en alcance, cronograma, costos, adquisiciones y entregables. Ejemplo: elegir un proveedor con menor huella de carbono aunque el costo inicial sea un poco mayor."],["🤝","Construye una cultura empoderada","Las personas rinden más cuando entienden el propósito, tienen autonomía y se sienten seguras de hablar. El director facilita, no solo controla."]].map(([i,t,x])=>`<details class="cx"><summary><span class="ic">${i}</span><b>${t}</b><em>Ver explicación</em></summary><div class="dt">${x}</div></details>`).join("")}</div>
<p>Los <b>7 dominios</b> son: <b>gobernanza</b> (decisiones, roles, supervisión), <b>alcance</b>, <b>cronograma</b>, <b>finanzas</b>, <b>interesados</b>, <b>recursos</b> y <b>riesgo</b>. Los procesos (40 en total) se presentan dentro de cada dominio de forma no prescriptiva: describen lo que conviene lograr y dejan al equipo elegir cómo hacerlo. Esto ayuda a adaptar el enfoque a proyectos predictivos, ágiles o híbridos.</p>
<div class="call wa"><b>⚠️ Ojo</b><div>Los nombres exactos de principios y dominios proceden de resúmenes de terceros y de la página de PMI. Contrástalos con tu ejemplar del libro.</div></div>
<h2>En profundidad: el director de proyecto frente a la PMO, paso a paso</h2>
<p>Imagina un proyecto de implementar un nuevo sistema de facturación. El <b>director de proyecto</b> arma el plan, gestiona al equipo, controla el avance, comunica con el patrocinador y resuelve los problemas del día a día. Su pregunta diaria es: <i>“¿mi proyecto va bien?”</i>.</p>
<p>La <b>PMO</b> pregunta otra cosa: <i>“¿nuestros proyectos, en conjunto, van bien y están creando el valor que la organización necesita?”</i>. Para responderla ofrece al director una plantilla de plan aprobada, una herramienta de seguimiento, un calendario de comités para escalar decisiones, un registro de capacidad para pedir personal y un coach si es su primer proyecto grande. A cambio, recibe datos comparables de su proyecto, que consolida en un reporte para el comité ejecutivo.</p>
<p>Cuando el sistema de facturación se retrasa y compite por programadores con otros dos proyectos, el director solo no puede resolverlo: la PMO muestra el conflicto con datos y el comité decide qué proyecto tiene prioridad. Esa es la esencia: <b>el director gestiona el proyecto; la PMO gestiona el sistema en el que los proyectos viven</b>.</p>
<h2>En profundidad: cómo se lee el valor ganado</h2>
<p>Un proyecto tiene presupuesto de 1000 y debería ir al 40% (PV = 400). Realmente va al 30% (EV = 300) y se gastaron 450 (AC = 450). Entonces: <b>CV = 300 − 450 = −150</b> (se gasta de más), <b>SV = 300 − 400 = −100</b> (hay atraso), <b>CPI = 300 / 450 = 0,67</b>, <b>SPI = 300 / 400 = 0,75</b>. Si no cambia el desempeño, <b>EAC = 1000 / 0,67 ≈ 1500</b>. Con estos números la PMO puede llevar al comité una conversación concreta: ¿se agrega presupuesto, se reduce alcance o se detiene el proyecto?</p>`,

c1:`<h2>En profundidad: cómo elegir el tipo de PMO</h2>
<p>No existe el tipo “correcto” en abstracto. Se decide por tres factores: <b>cultura</b> (¿se aceptan controles?), <b>madurez</b> (¿hay procesos?) y <b>problema a resolver</b> (¿falta visibilidad, consistencia o capacidad?). Una empresa de ingeniería regulada puede necesitar una PMO de control con auditorías; una startup de software suele funcionar mejor con una PMO de apoyo o un centro de excelencia ágil. Muchas organizaciones evolucionan: empiezan con apoyo, ganan credibilidad y luego añaden control donde aporta valor.</p>
<p>La <b>PMO directiva</b> es la que más responsabilidad asume: los directores de proyecto trabajan para ella y ella responde por los resultados. Es útil cuando la organización carece de directores de proyecto experimentados, pero tiene el costo de ser más intrusiva.</p>
<h2>En profundidad: la PMO centrada en el cliente</h2>
<p>La visión moderna trata a la PMO como un <b>proveedor de servicios</b>: sus clientes internos son los directores de proyecto (quieren ayuda), los patrocinadores (quieren resultados), los ejecutivos (quieren visibilidad y decisiones) y las áreas de negocio (quieren beneficios). El recorrido de seis etapas (Introducción, Exploración, Diseño, Despliegue, Mejora y Realización) forma un ciclo: cuanto más valor se realiza y se comunica, más apoyo recibe la PMO y más fácil es mejorarla. Si el valor no se percibe, el ciclo se frena.</p>
<h2>En profundidad: errores comunes de una PMO</h2>
<p>1) <b>Burocracia:</b> pedir documentos que nadie lee. 2) <b>Policía sin autoridad:</b> exigir cumplimiento sin el respaldo del patrocinador. 3) <b>Herramienta antes que proceso.</b> 4) <b>Querer implantar todo a la vez.</b> 5) <b>No medir resultados</b>, por lo que no puede demostrar valor. Cada uno se evita con diagnóstico previo, patrocinio claro, servicios graduales y métricas.</p>`,

c2:`<h2>En profundidad: cómo se hace un diagnóstico</h2>
<p>El diagnóstico combina <b>cuatro fuentes</b>: 1) <b>Entrevistas</b> con ejecutivos, patrocinadores y directores de proyecto; 2) <b>Revisión de proyectos recientes</b> (cuántos se terminaron a tiempo, cuántos tuvieron sobrecosto, cuántos entregaron beneficios); 3) <b>Revisión de documentos</b> (políticas, plantillas existentes, reportes); 4) <b>Observación</b> de cómo se toman las decisiones en la práctica. Con estos datos se arma un resumen que muestra el problema en cifras y propone opciones.</p>
<h2>En profundidad: el caso de negocio</h2>
<p>Un caso de negocio sólido incluye: <b>problema</b> (con datos), <b>objetivos</b>, <b>opciones</b> (incluyendo no hacer nada), <b>costos</b>, <b>beneficios</b> (cuantificados cuando es posible), <b>riesgos</b>, <b>supuestos</b> y <b>recomendación</b>. Los ejecutivos no deciden por entusiasmo, sino por números y riesgos comprensibles. Una buena práctica es presentar un piloto de bajo costo como primera opción.</p>
<h2>En profundidad: cultura y cambio</h2>
<p>Introducir una PMO es un cambio organizacional. Modelos útiles: <b>ADKAR</b> (Conciencia, Deseo, Conocimiento, Habilidad, Refuerzo) y los <b>8 pasos de Kotter</b> (urgencia, coalición, visión, comunicación, remover obstáculos, victorias a corto plazo, consolidar, anclar en la cultura). La clave: antes de pedir cambios de comportamiento, las personas deben <b>entender por qué</b> y <b>qué ganan</b>. La resistencia no es mala voluntad, es información: indica miedo a perder autonomía, carga de trabajo o falta de confianza.</p>
<div class="call eg"><b>📌 Ejemplo</b><div>En una empresa constructora, los jefes de obra se resisten a llenar reportes semanales. La PMO descubre que cada jefe usa su propio Excel y pierde 4 horas por semana consolidando. Ofrece un formato único con carga automática que les ahorra 2 horas. La resistencia baja porque el reporte pasa de ser “control” a ser “ayuda”.</div></div>`,

c3:`<h2>En profundidad: cómo se arma el catálogo de servicios</h2>
<p>Cada servicio se describe con: <b>nombre</b>, <b>qué problema resuelve</b>, <b>a quién sirve</b>, <b>qué entrega</b>, <b>cómo se solicita</b>, <b>nivel de servicio</b> (por ejemplo, “respuesta en 2 días hábiles”) y <b>cómo se mide</b>. Ejemplos: “Reporte mensual de portafolio”, “Revisión del acta de proyecto”, “Coaching para nuevos directores”, “Auditoría de salud de proyecto”, “Taller de gestión de riesgos”. Se priorizan primero los servicios que resuelven los dolores identificados en la exploración.</p>
<h2>En profundidad: gobernanza en la práctica</h2>
<p>Elementos típicos: <b>comité ejecutivo de portafolio</b> (aprueba y prioriza), <b>puertas de decisión</b> (por ejemplo: inicio, plan aprobado, entrega, cierre), <b>umbrales</b> (un cambio de más de 10% en costo o 1 mes en plazo va al comité) y <b>rutas de escalamiento</b> (qué se escala, a quién y en cuánto tiempo). La matriz RACI se usa para que cada decisión tenga un único Aprobador (A). Dos aprobadores producen parálisis; ninguno produce caos.</p>
<h2>En profundidad: adaptación (tailoring)</h2>
<p>Una buena metodología tiene <b>niveles</b>. Ejemplo: proyectos pequeños (menos de USD 50 mil): acta de una página y reporte mensual; medianos: plan completo y reporte quincenal; estratégicos: plan completo, comité mensual y auditoría. También se adapta por enfoque: ciclos iterativos para software, ruta crítica para infraestructura. La adaptación evita que la metodología sea un freno.</p>
<h2>En profundidad: elegir herramientas</h2>
<p>Se sigue este orden: 1) definir procesos y datos que se necesitan; 2) listar requisitos; 3) comparar opciones (costo, integraciones, facilidad de uso); 4) pilotar; 5) capacitar; 6) desplegar. Lo habitual es que una herramienta sencilla bien usada rinda más que una compleja a medias.</p>`,

c4:`<h2>En profundidad: el calendario de operación</h2>
<p>Una PMO que opera bien tiene <b>ritmo</b>: reuniones semanales de seguimiento con directores de proyecto, reporte mensual de portafolio, comité ejecutivo trimestral y revisión anual de la hoja de ruta. El ritmo da previsibilidad: los directores saben cuándo reportar y los ejecutivos, cuándo decidir.</p>
<h2>En profundidad: reportes que se usan</h2>
<p>Un reporte útil responde tres preguntas en una página: <b>¿cómo vamos?</b> (semáforo y tendencia), <b>¿qué nos preocupa?</b> (riesgos y problemas principales) y <b>¿qué necesitamos?</b> (decisiones, recursos). Define criterios objetivos para los colores (por ejemplo: verde = SPI y CPI ≥ 0,95; amarillo = entre 0,85 y 0,95; rojo = menor a 0,85). Así se evita que cada director aplique su criterio.</p>
<h2>En profundidad: gestión de riesgos a nivel portafolio</h2>
<p>La PMO no reemplaza el registro de cada proyecto; agrega valor consolidando: riesgos que afectan a varios proyectos (por ejemplo, un mismo proveedor crítico), dependencias entre proyectos y concentración de recursos. Se define una <b>escala común</b> de probabilidad e impacto para poder comparar y priorizar. Los riesgos que superan un umbral se escalan al comité.</p>
<h2>En profundidad: gestión de recursos y capacidad</h2>
<p>Se mantiene un registro de personas, habilidades y disponibilidad. Cada proyecto pide recursos por periodo; la PMO suma la demanda y la compara con la capacidad. Cuando la demanda supera a la capacidad, hay tres caminos: <b>reprogramar</b> proyectos, <b>contratar o subcontratar</b>, o <b>cancelar o diferir</b> los de menor valor. La nivelación evita picos que agotan al equipo y generan errores.</p>
<h2>En profundidad: gestión de cambios y de la línea base</h2>
<p>La línea base es la versión aprobada del alcance, cronograma y costo. Un cambio se evalúa por su impacto, se aprueba o rechaza en la instancia correcta y, si se aprueba, <b>se actualiza la línea base</b> y se comunica. Sin este proceso, los proyectos “derivan”: nadie sabe contra qué medir el desempeño.</p>`,

c5:`<h2>En profundidad: medir la efectividad de la PMO</h2>
<p>Se usan tres niveles de indicadores: <b>servicio</b> (tiempo de respuesta, uso de servicios, satisfacción), <b>proceso</b> (cumplimiento de metodología, calidad de datos) y <b>resultado</b> (proyectos en meta, ahorros, beneficios realizados). Los indicadores de resultado son los que más valoran los ejecutivos; los de servicio permiten mejorar el día a día. Un error frecuente es medir solo actividad (número de reportes) y no efecto (decisiones tomadas gracias a ellos).</p>
<h2>En profundidad: modelos de madurez</h2>
<p>Un modelo de madurez describe niveles progresivos: desde procesos informales e individuales hasta procesos medidos y optimizados. Se usan para: 1) <b>diagnosticar</b> el estado actual, 2) <b>comparar</b> con referencias, 3) <b>definir el siguiente nivel</b> realista y 4) <b>medir el avance</b>. No se trata de llegar al nivel máximo en todo, sino al nivel que la organización necesita y puede sostener.</p>
<h2>En profundidad: aprender de la experiencia</h2>
<p>El proceso de lecciones aprendidas: capturar (al cierre de cada fase, no solo al final), analizar (¿es causa raíz o síntoma?), convertir en acción (cambiar una plantilla, un criterio, un proceso), comunicar y verificar que la acción se aplicó. Las lecciones sin acción se vuelven un archivo muerto.</p>
<div class="call eg"><b>📌 Ejemplo</b><div>La PMO nota que 6 de 10 proyectos de TI se retrasan en pruebas. Causa raíz: no se reservaba tiempo para corregir errores. Acción: la plantilla de cronograma incorpora una fase de corrección obligatoria. Resultado: los siguientes 10 proyectos reducen atrasos de 60% a 30%.</div></div>`,

c6:`<h2>En profundidad: cómo se construye el argumento de valor</h2>
<p>Estructura recomendada: <b>1) situación inicial</b> con datos (por ejemplo, 42% de proyectos en meta), <b>2) intervención</b> (qué servicios dio la PMO), <b>3) resultado</b> (61% en meta, 18 días menos de aprobación, USD 800 mil ahorrados) y <b>4) siguiente paso</b> (qué se propone y qué se necesita). Los resultados deben poder atribuirse razonablemente a la PMO y respaldarse con datos verificables; las cifras infladas destruyen la credibilidad.</p>
<h2>En profundidad: tipos de beneficios</h2>
<p>Beneficios <b>financieros</b> (ahorro de costos, ingresos), <b>operativos</b> (menos tiempo de ciclo, menos errores), <b>estratégicos</b> (nuevas capacidades, cumplimiento, posicionamiento) y <b>cualitativos</b> (satisfacción, reputación). Los cualitativos también se pueden medir con encuestas y escalas. Conviene mezclar tipos para mostrar un panorama completo.</p>
<h2>En profundidad: tableros y narrativa</h2>
<p>Un tablero ejecutivo tiene entre 5 y 8 indicadores, con tendencia en el tiempo y comparación contra la meta. Se acompaña de una narrativa breve: qué pasó, por qué y qué se decide. Las historias con datos son más persuasivas que los datos solos y que las historias solas.</p>
<h2>En profundidad: cómo se calculan las medidas financieras</h2>
<p><b>ROI</b> = beneficio neto / costo (beneficio neto = beneficios − costo). <b>Payback</b> = inversión / beneficio anual (si es constante). <b>VAN</b> = suma de los flujos futuros descontados − inversión inicial. Ejemplo: inversión 100; beneficios de 50 al año durante 3 años; tasa 10%. VAN ≈ 50/1,1 + 50/1,21 + 50/1,331 − 100 ≈ 24,3 → positivo, conviene. Payback = 100/50 = 2 años.</p>`,

c7:`<h2>En profundidad: competencias de una PMO</h2>
<p>El equipo de la PMO necesita: <b>capacidad analítica</b> (datos, tableros), <b>conocimiento de metodologías</b>, <b>comunicación ejecutiva</b>, <b>facilitación</b> (reuniones y talleres), <b>negociación</b> e <b>influencia sin autoridad</b>: muchas veces la PMO debe lograr cambios en personas que no le reportan. Esta última es de las más difíciles y valiosas.</p>
<h2>En profundidad: estilos de liderazgo</h2>
<p>Un buen líder cambia de estilo según el contexto: <b>directivo</b> (equipos nuevos o crisis), <b>coaching</b> (desarrollo de personas), <b>participativo</b> (buscar consenso), <b>delegativo</b> (equipos maduros), <b>servicial</b> (remueve obstáculos). Los equipos ágiles valoran el liderazgo servicial; en una emergencia, el directivo. Ser flexible es parte de la competencia.</p>
<h2>En profundidad: conflictos</h2>
<p>Técnicas: <b>colaborar/resolver el problema</b> (ganar-ganar, la preferida), <b>comprometer</b> (cada uno cede algo), <b>suavizar</b> (resaltar acuerdos), <b>forzar</b> (imponer una solución; útil en emergencias) y <b>evitar</b> (retirarse; útil solo si el tema es trivial). En el examen, ante dos opciones razonables, suele ser mejor la que trata la causa del conflicto.</p>
<h2>En profundidad: dilemas éticos</h2>
<p>Ante un dilema: 1) reúne los hechos, 2) identifica quién resulta afectado, 3) consulta las políticas y el código de ética, 4) busca asesoría si es necesario, 5) decide y 6) <b>documenta</b>. Si hay conflicto entre lo que pide un jefe y la ética, la respuesta esperada es actuar con integridad y escalar a la instancia adecuada, nunca ocultar información.</p>`,

c8:`<h2>En profundidad: cómo se prioriza con una matriz de criterios</h2>
<p>Se definen criterios (por ejemplo: alineación estratégica 30%, valor financiero 25%, riesgo 15%, urgencia o requisito legal 15%, capacidad 15%), se califica cada proyecto de 1 a 5 y se calcula un puntaje ponderado. El resultado orienta la discusión del comité; no la reemplaza. Hay proyectos que se aprueban aunque su puntaje sea bajo (obligaciones regulatorias o de seguridad) y se registran como excepciones transparentes.</p>
<h2>En profundidad: gobernanza del portafolio</h2>
<p>El comité revisa periódicamente el portafolio: ¿siguen alineados los proyectos con la estrategia? ¿Hay nuevas oportunidades? ¿Hay proyectos que deben detenerse? Las decisiones posibles: <b>continuar</b>, <b>corregir</b>, <b>pausar</b>, <b>detener</b> o <b>acelerar</b>. Detener a tiempo libera recursos para iniciativas de más valor.</p>
<h2>En profundidad: portafolio, programa y proyecto en una misma historia</h2>
<p>Una empresa tiene como estrategia “crecer 20% en el mercado digital”. El <b>portafolio</b> incluye una iniciativa de comercio electrónico, otra de analítica de clientes y una de infraestructura. La de comercio electrónico se gestiona como <b>programa</b>: sitio web, logística y marketing; cada uno es un <b>proyecto</b>. La PMO consolida la visión, asegura que cada nivel apunte a la estrategia y reporta beneficios.</p>
<h2>En profundidad: gestión de beneficios y quién los “posee”</h2>
<p>Un error clásico es creer que el director del proyecto es dueño del beneficio. No lo es: él entrega una capacidad (por ejemplo, un sistema). El beneficio (menos tiempo de atención) lo realiza el área de negocio cuando adopta el sistema. Por eso se nombra un <b>dueño del beneficio</b> en el negocio, con una métrica y una fecha de revisión posterior al cierre.</p>`

/* ============ ESTADO ============ */
const KEY="portal_pmocp_v2";
const BOX_DAYS=[0,1,2,4,8,16];
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||typeof S!=="object")S={};
 S.lessons=S.lessons||{};S.cards=S.cards||{};S.stats=S.stats||{};S.exams=S.exams||[];S.seen=S.seen||{};S.visits=(S.visits||0);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
const day=86400000;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const chOf=id=>CH.find(c=>c.id===id);
function rec(c,ok){const s=S.stats[c]=S.stats[c]||{ok:0,t:0};s.t++;if(ok)s.ok++;save()}
function pct(c){const s=S.stats[c];return s&&s.t?Math.round(100*s.ok/s.t):null}
function bar(p,cls){return `<div class="bar ${cls||""}"><i style="width:${p||0}%"></i></div>`}
function ring(p,label){const r=34,c=2*Math.PI*r;return `<div class="rg"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="${r}" class="rb"/><circle cx="40" cy="40" r="${r}" class="rf" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 40 40)"/></svg><b>${p}%</b></div>`}

/* preferir preguntas que se han visto menos; azar en el desempate */
function pickQ(pool,n){return shuf(pool).sort((a,b)=>(S.seen[a]||0)-(S.seen[b]||0)).slice(0,n)}

/* ============ NAVEGACIÓN ============ */
const VIEWS={inicio:"Inicio",capitulos:"Capítulos",tarjetas:"Tarjetas",practica:"Práctica",simulacro:"Simulacro",progreso:"Progreso",fuentes:"Fuentes"};
let view="inicio",tmr=null,qz=null;
function nav(v,arg){clearInterval(tmr);view=v;qz=null;
 $("#nav").innerHTML=Object.entries(VIEWS).map(([k,n])=>`<button class="${k===v||(v==="capitulo"&&k==="capitulos")?"on":""}" onclick="nav('${k}')">${n}</button>`).join("");
 R[v](arg);window.scrollTo(0,0)}
const R={};

/* ---- Inicio ---- */
