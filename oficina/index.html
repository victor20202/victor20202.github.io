 const due=CARDS.filter((c,i)=>!S.cards[i]||S.cards[i].due<=Date.now()).length;
 const weak=weakest();
 const next=CH.find(c=>!S.lessons[c.id])||CH[0];
 $("#app").innerHTML=`<div class="aviso"><b>📌 Aviso importante</b><p>Este portal es <b>material de estudio independiente</b>, de carácter <b>únicamente informativo y educativo</b>, creado para ayudarte a prepararte para una certificación. Su contenido está redactado con palabras propias a partir de información pública y no reproduce material oficial.</p><p>No está afiliado, patrocinado ni respaldado por PMI®. PMI, PMP, PMBOK, PMI-RMP y PMI-PMOCP son marcas de sus respectivos titulares y se mencionan solo para indicar a qué certificación se orienta el estudio. No sustituye las guías oficiales ni garantiza resultados en el examen: confirma siempre requisitos y contenidos en pmi.org.</p></div><section class="hero"><div><h1>De cero a la certificación en oficinas de proyectos</h1><p>Aprende gestión de proyectos y PMO capítulo por capítulo, practica con preguntas al azar y mide tu avance.</p>
 <div class="row"><button class="btn big" onclick="nav('capitulo','${next.id}')">${done?"Continuar: ":"Empezar: "}Cap. ${next.n}</button><button class="btn ghost" onclick="nav('simulacro')">Simulacro</button></div></div><div class="hr">🎓</div></section>
 <div class="grid">
  <div class="card stat"><span class="mu">Capítulos leídos</span><div class="bigx">${done}/${tot}</div>${bar(100*done/tot,"g")}</div>
  <div class="card stat"><span class="mu">Tarjetas por repasar hoy</span><div class="bigx">${due}</div><button class="btn sec" onclick="nav('tarjetas')">Repasar</button></div>
  <div class="card stat"><span class="mu">Tema más débil</span><div class="bigx s">${weak?esc(chOf(weak.k).t.split(":")[0]):"Sin datos"}</div>${weak?`<span class="mu">${weak.p}% de acierto</span>`:""}</div>
 </div>
 <h2>🎲 Reto rápido <span class="mu">(5 preguntas al azar distintas cada vez que entras)</span></h2>
 <div id="qbox"></div>
 <h2>Cómo estudiar</h2>
 <div class="cc"><div class="cx"><div class="ic">1</div><b>Lee un capítulo</b><span>Con calma, mirando los gráficos y tarjetas.</span></div><div class="cx"><div class="ic">2</div><b>Repasa tarjetas</b><span>Repetición espaciada: lo que fallas vuelve antes.</span></div><div class="cx"><div class="ic">3</div><b>Practica el tema</b><span>Preguntas al azar con explicación inmediata.</span></div><div class="cx"><div class="ic">4</div><b>Haz simulacros</b><span>Cronometrados, sin ayuda, para medir tu nivel.</span></div></div>
 <h2>Requisitos para obtener la certificación PMI-PMOCP™</h2><div class="card reqc"><ul><li><b>Educación:</b> título de secundaria (o equivalente).</li><li><b>Experiencia:</b> 3 años de experiencia en proyectos dentro de los últimos 8 años, <b>o</b> tener el PMP vigente.</li><li><b>Formación:</b> 10 horas de educación en PMO.</li><li><b>Examen:</b> 120 preguntas, 165 minutos, en centro Pearson VUE o en línea.</li><li><b>Costo publicado:</b> USD 520 miembros / USD 700 no miembros (el pago se hace tras aceptar la solicitud).</li><li><b>Mantenimiento:</b> cada 3 años; las páginas de PMI muestran cifras distintas de PDUs (40 y 60), por lo que conviene confirmarlo.</li></ul><div class="mu">Información basada en las páginas públicas de PMI. Puede cambiar con el tiempo; verifícala en <a href="#" onclick="nav('fuentes');return false">Fuentes</a>, donde están los enlaces oficiales.</div></div>`;
 startQuiz(null,5,false,{target:"#qbox",embed:true})};
function weakest(){let b=null;for(const c of CH){const p=pct(c.id);if(p!==null&&(!b||p<b.p))b={k:c.id,p}}return b}

/* ---- Capítulos ---- */
R.capitulos=()=>{
 $("#app").innerHTML=`<h1>Capítulos</h1><p class="mu">Sigue el orden: el capítulo 0 es la base de proyectos y la relación con la PMO; luego, las seis etapas del recorrido de una PMO.</p>
 <div class="chgrid">${CH.map(c=>{const p=pct(c.id);return `<div class="chc ${S.lessons[c.id]?"done":""}" onclick="nav('capitulo','${c.id}')"><div class="cn">${c.ic}<small>Cap. ${c.n}</small></div><h3>${c.t}</h3><p class="mu">${c.sub}</p><div class="meta"><span class="tag">⏱ ${c.min} min</span>${S.lessons[c.id]?`<span class="tag ok">✔ leído</span>`:""}${p!==null?`<span class="tag">${p}% acierto</span>`:""}</div></div>`}).join("")}</div>
 <h2>Cómo se conecta con los 6 dominios del examen</h2>
 <div class="card"><table><tr><th>Dominio del examen</th><th>Peso</th><th>Capítulos</th></tr>
 <tr><td>Desarrollo y alineación organizacional</td><td>16%</td><td>2 · 8</td></tr>
 <tr><td>Elementos estratégicos de la PMO</td><td>18%</td><td>1 · 3 · 8</td></tr>
 <tr><td>Diseño y estructuración de la PMO</td><td>18%</td><td>3</td></tr>
 <tr><td>Operación y desempeño de la PMO</td><td>15%</td><td>4 · 6</td></tr>
 <tr><td>Mejora y efectividad de la PMO</td><td>18%</td><td>5 · 6</td></tr>
 <tr><td>Personas</td><td>15%</td><td>7</td></tr></table>
 <p class="mu">Relación orientativa hecha por mí; no es el mapeo oficial.</p></div>`};

R.capitulo=id=>{
 const c=chOf(id),i=CH.indexOf(c),prev=CH[i-1],nx=CH[i+1];
 $("#app").innerHTML=`<div class="crumb"><a href="#" onclick="nav('capitulos');return false">← Capítulos</a></div>
 <article class="lesson"><header class="lh"><div class="ic2">${c.ic}</div><div><span class="tag">Capítulo ${c.n}</span><span class="tag">⏱ ${c.min} min</span><h1>${c.t}</h1><p class="mu">${c.ex}</p></div></header>
 <div class="lead">${c.sub}</div><div id="toc"></div>${c.b()}
 <div class="row end"><button class="btn" onclick="markLesson('${c.id}')">${S.lessons[c.id]?"✔ Capítulo completado":"Marcar como leído"}</button><button class="btn sec" onclick="startQuiz('${c.id}',10)">Practicar este capítulo</button><button class="btn sec" onclick="nav('tarjetas','${c.id}')">Tarjetas</button></div>
 <div class="row sp">${prev?`<button class="btn sec" onclick="nav('capitulo','${prev.id}')">← Cap. ${prev.n}</button>`:"<span></span>"}${nx?`<button class="btn sec" onclick="nav('capitulo','${nx.id}')">Cap. ${nx.n} →</button>`:""}</div></article>`;buildToc()};
function buildToc(){const hs=[...document.querySelectorAll(".lesson h2")];if(!hs.length)return;
 hs.forEach((h,i)=>h.id="s"+i);
 $("#toc").innerHTML=`<div class="toc"><b>En este capítulo:</b>${hs.map((h,i)=>`<a href="#s${i}" onclick="document.getElementById('s${i}').scrollIntoView({behavior:'smooth'});return false">${h.textContent.replace(/^\d+\.\s*/,"")}</a>`).join("")}</div>`}
function markLesson(id){S.lessons[id]=Date.now();save();R.capitulo(id)}

/* ---- Tarjetas (Leitner) ---- */
let deck=[],ci=0,flip=false,deckCh=null;
R.tarjetas=c=>{deckCh=c||null;const now=Date.now();
 deck=shuf(CARDS.map((x,i)=>i).filter(i=>(!deckCh||CARDS[i][0]===deckCh)&&(!S.cards[i]||S.cards[i].due<=now)));ci=0;flip=false;drawCard()};
function drawCard(){
 const filt=`<select onchange="R.tarjetas(this.value||null)"><option value="">Todos los capítulos</option>${CH.map(c=>`<option value="${c.id}" ${c.id===deckCh?"selected":""}>Cap. ${c.n}: ${esc(c.t.slice(0,40))}</option>`).join("")}</select>`;
 if(ci>=deck.length){$("#app").innerHTML=`<h1>Tarjetas</h1>${filt}<div class="card" style="margin-top:12px">🎉 No quedan tarjetas pendientes por ahora. Las que fallaste vuelven pronto; las que sabías, en días.</div>`;return}
 const i=deck[ci],c=CARDS[i];
 $("#app").innerHTML=`<h1>Tarjetas</h1>${filt}<p class="mu">${ci+1} de ${deck.length} · Cap. ${chOf(c[0]).n}</p>
 <div class="flash ${flip?"back":""}" onclick="flip=!flip;drawCard()"><span class="mu">${flip?"Respuesta":"Concepto"}</span><div>${flip?esc(c[2]):"<b>"+esc(c[1])+"</b>"}</div></div>
 ${flip?`<div class="row"><button class="btn bad" onclick="grade(${i},false)">No lo sabía</button><button class="btn good" onclick="grade(${i},true)">Lo sabía</button></div>`:`<div class="mu">Intenta recordar la respuesta y luego toca la tarjeta.</div>`}`}
function grade(i,ok){const s=S.cards[i]||{box:0};s.box=ok?Math.min(5,s.box+1):1;
 s.due=ok?Date.now()+BOX_DAYS[s.box]*day:Date.now()+10*60000;
 S.cards[i]=s;rec(CARDS[i][0],ok);ci++;flip=false;drawCard()}

/* ---- Práctica ---- */
R.practica=()=>{
 $("#app").innerHTML=`<h1>Práctica</h1><p class="mu">Cada vez se eligen preguntas al azar; se priorizan las que has visto menos.</p><div class="grid">`+
 CH.map(c=>`<div class="card"><b>${c.ic} Cap. ${c.n}</b><div class="mu">${esc(c.t)}</div><div class="mu">${Q.filter(q=>q[0]===c.id).length} preguntas · acierto ${pct(c.id)===null?"–":pct(c.id)+"%"}</div><div class="row"><button class="btn" onclick="startQuiz('${c.id}',10)">Practicar</button></div></div>`).join("")+
 `</div><div class="card"><b>🎲 Mixto</b><div class="mu">20 preguntas al azar de todos los capítulos</div><div class="row"><button class="btn" onclick="startQuiz(null,20)">Practicar mixto</button></div></div>`};

/* ---- Cuestionario ---- */
function startQuiz(ch,n,exam,opt){
 opt=opt||{};
 let pool=Q.map((q,i)=>i).filter(i=>!ch||Q[i][0]===ch);
 pool=pickQ(pool,n||pool.length);
 clearInterval(tmr);
 qz={items:pool.map(i=>({i,order:shuf([0,1,2,3]),sel:null})),pos:0,exam:!!exam,ch,n,target:opt.target||"#app",embed:!!opt.embed};
 drawQ()}
function drawQ(){
 const it=qz.items[qz.pos],q=Q[it.i],ans=it.sel!==null,box=$(qz.target);
 const last=qz.pos===qz.items.length-1;
 box.innerHTML=`<div class="qh"><span class="mu">Pregunta ${qz.pos+1} de ${qz.items.length} · Cap. ${chOf(q[0]).n}</span>${qz.exam?`<b id="clk"></b>`:""}</div>${bar(100*(qz.pos+(ans?1:0))/qz.items.length)}
 <div class="card q"><h3 style="margin-top:0">${esc(q[1])}</h3>
 ${it.order.map((oi,k)=>{let c="opt";if(!qz.exam&&ans){if(oi===q[3])c+=" ok";else if(oi===it.sel)c+=" ko"}else if(it.sel===oi)c+=" sel";
  return `<button class="${c}" ${(ans&&!qz.exam)?"disabled":""} onclick="pick(${oi})"><i>${"ABCD"[k]}</i>${esc(q[2][oi])}</button>`}).join("")}
 ${ans&&!qz.exam?`<div class="exp"><b>${it.sel===q[3]?"✔ Correcto":"✘ Incorrecto"}.</b> ${esc(q[4])}</div>`:""}
 <div class="row"><button class="btn sec" ${qz.pos===0?"disabled":""} onclick="qz.pos--;drawQ()">Anterior</button>
 <button class="btn" ${!ans&&!qz.exam?"disabled":""} onclick="${last?"finishQuiz()":"qz.pos++;drawQ()"}">${last?"Terminar":"Siguiente"}</button></div></div>`;
 if(qz.exam)tick()}
function pick(oi){const it=qz.items[qz.pos];if(!qz.exam&&it.sel!==null)return;it.sel=oi;
 if(!qz.exam){S.seen[it.i]=(S.seen[it.i]||0)+1;rec(Q[it.i][0],oi===Q[it.i][3])}drawQ()}
function finishQuiz(){clearInterval(tmr);
 let ok=0;const by={};
 qz.items.forEach(it=>{const q=Q[it.i],good=it.sel===q[3];if(good)ok++;
  if(qz.exam){S.seen[it.i]=(S.seen[it.i]||0)+1;rec(q[0],good)}
  by[q[0]]=by[q[0]]||{ok:0,t:0};by[q[0]].t++;if(good)by[q[0]].ok++});
 const n=qz.items.length,p=Math.round(100*ok/n);
 if(qz.exam){S.exams.push({d:Date.now(),ok,n});save()}
 const wrong=qz.items.filter(it=>it.sel!==Q[it.i][3]),embed=qz.embed,box=$(qz.target);
 box.innerHTML=`<div class="card res">${ring(p)}<div><h2 style="margin:0">Resultado: ${ok}/${n}</h2><div class="mu">${p>=75?"¡Muy bien!":p>=60?"Vas bien, sigue practicando.":"Repasa el capítulo y vuelve a intentarlo."}</div>
 <div class="row"><button class="btn" onclick="${embed?"startQuiz(null,5,false,{target:'#qbox',embed:true})":"nav('practica')"}">${embed?"🎲 Otro reto":"Volver a práctica"}</button></div></div></div>
 ${!embed?`<div class="card">${Object.entries(by).map(([k,v])=>`<div>Cap. ${chOf(k).n} · ${esc(chOf(k).t)} <span class="mu">${v.ok}/${v.t}</span>${bar(100*v.ok/v.t,v.ok/v.t>=.7?"g":"r")}</div>`).join("<br>")}</div>`:""}
 ${wrong.length?`<h3>Revisa lo que fallaste (${wrong.length})</h3>`+wrong.map(it=>{const q=Q[it.i];return `<div class="card"><b>${esc(q[1])}</b><div class="mu">Tu respuesta: ${it.sel===null?"sin responder":esc(q[2][it.sel])}</div><div class="okt">Correcta: ${esc(q[2][q[3]])}</div><div class="exp">${esc(q[4])}</div></div>`}).join(""):`<div class="card">🎉 Sin errores.</div>`}`;
 save()}

/* ---- Simulacro ---- */
R.simulacro=()=>{
 const hist=S.exams.slice(-5).reverse().map(e=>`<tr><td>${new Date(e.d).toLocaleDateString()}</td><td>${e.ok}/${e.n}</td><td>${Math.round(100*e.ok/e.n)}%</td></tr>`).join("");
 const nmax=Q.length;
 $("#app").innerHTML=`<h1>Simulacro de examen</h1>
 <div class="card">Preguntas al azar de todos los capítulos, <b>sin retroalimentación hasta el final</b> y con cronómetro. Puedes ir y volver entre preguntas.
 <div class="mu">El examen real: 120 preguntas en 165 min (≈1,4 min por pregunta). Aquí se mantiene la misma proporción.</div>
 <div class="row"><select id="nq"><option value="30">30 preguntas · 41 min</option><option value="60" selected>60 preguntas · 83 min</option><option value="${nmax}">Todas (${nmax}) · ${Math.round(nmax*165/120)} min</option></select>
 <button class="btn" onclick="startExam()">Iniciar simulacro</button></div></div>
 ${hist?`<div class="card"><b>Últimos intentos</b><table><tr><th>Fecha</th><th>Aciertos</th><th>%</th></tr>${hist}</table></div>`:""}`};
let endAt=0;
function startExam(){const n=Math.min(Q.length,+$("#nq").value);endAt=Date.now()+n*165/120*60000;startQuiz(null,n,true)}
function tick(){clearInterval(tmr);
 const f=()=>{const e=$("#clk");if(!e||!qz||!qz.exam){clearInterval(tmr);return}
  const left=endAt-Date.now();if(left<=0){clearInterval(tmr);finishQuiz();return}
  const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);e.textContent="⏱ "+m+":"+String(s).padStart(2,"0")};
 f();tmr=setInterval(f,1000)}

/* ---- Progreso ---- */
R.progreso=()=>{
 const rows=CH.map(c=>{const p=pct(c.id),s=S.stats[c.id];
  return `<tr><td>${c.ic} Cap. ${c.n}: ${esc(c.t)}</td><td style="width:34%">${bar(p,p===null?"":p>=75?"g":p>=60?"y":"r")}</td><td>${p===null?"–":p+"% ("+s.ok+"/"+s.t+")"}</td></tr>`}).join("");
 const weak=CH.filter(c=>pct(c.id)!==null&&pct(c.id)<70);
